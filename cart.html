<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า - Hello Pet Shop</title>
    <!-- Use Vite to load styles -->
    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/cart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="bg-white min-h-screen flex flex-col">
    <!-- Role Check script -->
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        const role = user ? (user.role_name || '').toLowerCase() : '';
        if (role && role !== 'customer') {
            // window.location.href = 'login.html'; 
        }
    </script>

    <!-- Header / Navbar -->
    <header class="nav-green text-white shadow-md sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <!-- Logo -->
                <a href="products.html" class="flex items-center space-x-2 hover:opacity-90 transition-opacity">
                    <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center text-[#1b4332]">
                        <i class="fas fa-paw text-lg"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight">Hello Pet Shop</span>
                </a>

                <!-- Nav Links -->
                <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                    <a href="products.html" class="hover:text-gray-200 transition-colors">หน้าแรก</a>
                    <a href="my-pets.html" class="hover:text-gray-200 transition-colors">สัตว์เลี้ยงของฉัน</a>
                    <a href="order-history.html" class="hover:text-gray-200 transition-colors">ประวัติคำสั่งซื้อ</a>
                </div>
            </div>

            <!-- Right side icons -->
            <div class="flex items-center space-x-8">
                <a href="cart.html" class="relative hover:text-gray-200 transition-colors block">
                    <i class="fas fa-shopping-basket text-xl"></i>
                    <span id="cartCount"
                        class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
                </a>
                <div class="relative">
                    <button id="navProfileMenuBtn"
                        class="block w-8 h-8 rounded-full overflow-hidden bg-white/15 hover:bg-white/25 border border-white/30 shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-white flex items-center justify-center text-white">
                        <div id="navDefaultAvatar" class="w-full h-full flex items-center justify-center text-white">
                            <i class="fas fa-user text-white text-[14px]"></i>
                        </div>
                        <img id="navProfileImage" src="" alt="Profile" class="w-full h-full object-cover hidden">
                    </button>

                    <!-- Dropdown Menu -->
                    <div id="navProfileDropdown"
                        class="absolute right-0 mt-3 w-44 bg-white rounded-xl shadow-xl py-2 border border-gray-100 hidden z-50 transform origin-top-right transition-all">
                        <a href="profile.html"
                            class="block px-4 py-2.5 text-[15px] font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="fa-regular fa-user mr-2 text-gray-500"></i> ข้อมูลโปรไฟล์
                        </a>
                        <div class="border-t border-gray-100 my-1"></div>
                        <button id="logoutBtn"
                            class="w-full text-left px-4 py-2.5 text-[15px] font-medium text-red-600 hover:bg-red-50 transition-colors">
                            <i class="fas fa-sign-out-alt mr-2 text-red-500"></i> ออกจากระบบ
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-5xl mx-auto px-4 py-8 pb-8">
        <h1 class="text-[28px] font-bold text-[#1f2937] mb-8">ตะกร้าสินค้า</h1>

        <!-- Cart Items Container -->
        <div id="cartItemsContainer" class="space-y-4 mb-8">
            <!-- Items loaded via JS -->
        </div>

        <!-- Subtotal & Proceed Section -->
        <div class="flex items-center justify-between pt-6 border-t border-gray-100 mb-8">
            <div class="flex flex-col ml-1">
                <h2 class="text-[17px] sm:text-[19px] font-bold text-[#1f2937]">ยอดรวม</h2>
                <div class="flex items-center space-x-3 mt-1 flex-wrap gap-y-1">
                    <p id="cartSubtotal" class="text-secondary-600 font-extrabold text-xl sm:text-2xl font-mono">฿0.00</p>
                    <span id="cartPointsEarnedBadge" class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 inline-flex items-center" style="display: none;">
                        <i class="fas fa-coins text-amber-500 mr-1"></i>จะได้รับ <span id="cartPointsEarnedText" class="mx-1">+0</span> แต้ม
                    </span>
                </div>
            </div>

            <div>
                <button id="checkoutBtn"
                    class="bg-secondary-600 hover:bg-secondary-700 text-white px-7 py-3 rounded-xl font-bold transition-all shadow-md hover:shadow-lg active:scale-95 tracking-wide text-[15px]">
                    สั่งซื้อ
                </button>
            </div>
        </div>
    </main>

    <!-- Customer Bottom Navigation for Mobile -->
    <nav class="customer-bottom-nav">
        <a href="products.html" class="customer-nav-item">
            <i class="fas fa-store"></i>
            <span>สินค้า</span>
        </a>
        <a href="my-pets.html" class="customer-nav-item">
            <i class="fas fa-paw"></i>
            <span>สัตว์เลี้ยง</span>
        </a>
        <a href="order-history.html" class="customer-nav-item">
            <i class="fas fa-receipt"></i>
            <span>คำสั่งซื้อ</span>
        </a>
        <a href="cart.html" class="customer-nav-item active">
            <i class="fas fa-shopping-basket"></i>
            <span>ตะกร้า</span>
        </a>
        <a href="profile.html" class="customer-nav-item">
            <i class="fas fa-user"></i>
            <span>โปรไฟล์</span>
        </a>
    </nav>

    <!-- Toast Component -->
    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-xl transition-all duration-500 opacity-0 translate-y-4 pointer-events-none z-50">
    </div>
</body>

</html>

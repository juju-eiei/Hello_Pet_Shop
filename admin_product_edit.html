<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขข้อมูลสินค้า - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Mobile User-Agent Check -->
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
<script type="module" src="/src/js/main.js"></script>
<style>
    @keyframes pulseScan {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }
    .scan-icon-pulse {
        animation: pulseScan 1.5s infinite ease-in-out;
        display: inline-block;
    }
</style>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-header"></header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <a href="admin_product_management.html" style="color: var(--primary-green); font-size: 24px; text-decoration: none;">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <h1 id="pageTitle" style="margin: 0;">Add/Edit Product</h1>
                </div>
            </div>
            
            <div class="form-card">
                <form id="productForm" enctype="multipart/form-data">
                    <input type="hidden" name="id" id="productId">
                    
                    <div class="form-grid">
                        <!-- Left Side -->
                        <div class="form-left">
                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" name="name" id="pName" required placeholder="e.g. Premium Dog Food">
                            </div>

                            <div class="form-group">
                                <label>Category</label>
                                <div class="category-input-group">
                                    <select name="category_id" id="pCategory" required>
                                        <option value="">Loading categories...</option>
                                    </select>
                                    <button type="button" class="add-category-btn" onclick="addNewCategory()">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>เหมาะสำหรับสัตว์เลี้ยงประเภท (Target Pet Type)</label>
                                <select name="target_pet_type_id" id="pTargetPetType" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; color: #1e293b; outline: none; background-color: #fff;">
                                    <option value="1">กำลังโหลดประเภทสัตว์เลี้ยง...</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Cost Price (฿)</label>
                                <input type="number" step="0.01" name="cost_price" id="pCostPrice" required value="0">
                            </div>

                            <div class="form-group">
                                <label>Price (฿)</label>
                                <input type="number" step="0.01" name="price" id="pPrice" required>
                            </div>

                            <div class="form-group">
                                <label>Stock Quantity</label>
                                <input type="number" name="stock_quantity" id="pStock" required value="0">
                            </div>
                            
                            <div class="form-group">
                                <label>Weight / Volume</label>
                                <div style="display: flex; gap: 8px;">
                                    <input type="number" step="0.001" min="0" name="weight_value" id="pWeightValue" required style="flex: 2;">
                                    <select name="weight_unit" id="pWeightUnit" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; color: #1e293b; outline: none; background-color: #fff;">
                                        <option value="kg">kg (กิโลกรัม)</option>
                                        <option value="g">g (กรัม)</option>
                                        <option value="L">L (ลิตร)</option>
                                        <option value="ml">ml (มิลลิลิตร)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Right Side (Image & Options) -->
                        <div class="form-right">
                            <div class="form-group">
                                <label>Product Image</label>
                                <div class="image-preview-container">
                                    <img id="imgPreview" src="/image/non-image.png" class="preview-img" onerror="this.src='/image/non-image.png'">
                                    <div class="upload-selector">
                                        <button type="button" class="upload-mode-btn active" id="modeUrl" onclick="switchUploadMode('url')">Use URL</button>
                                        <button type="button" class="upload-mode-btn" id="modeFile" onclick="switchUploadMode('file')">Upload File</button>
                                    </div>
                                    <input type="text" id="pImageUrl" name="image_url" placeholder="Paste image URL here" oninput="previewImage(this.value)">
                                    <input type="file" id="pImageFile" name="image" style="display: none;" accept="image/*" onchange="previewFile(this)">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Barcode</label>
                                <input type="text" name="barcode" id="pBarcode">
                                <div style="display: flex; gap: 8px; margin-top: 8px;">
                                    <button type="button" onclick="generateRandomBarcode()" class="action-link" style="flex: 1; padding: 8px 12px; background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-weight: 600; color: #475569; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s; outline: none; border-style: solid;">
                                        <i class="fas fa-random"></i> สุ่มบาร์โค้ด
                                    </button>
                                    <button type="button" onclick="startBarcodeScan()" class="action-link" style="flex: 1; padding: 8px 12px; background-color: var(--secondary-berry-light); border: 1px solid var(--secondary-berry-border); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--secondary-berry-hover); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s; outline: none; border-style: solid;">
                                        <i class="fas fa-barcode"></i> ยิงบาร์โค้ด
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Full Width -->
                        <div class="form-group full-width">
                            <label>Product Description</label>
                            <textarea name="description" id="pDesc" rows="4" placeholder="Enter product details..."></textarea>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="save-btn">Save Product</button>
                        <a href="admin_product_management.html" class="back-btn">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Modal for New Category -->
    <div id="promptModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="modalTitle">เพิ่มหมวดหมู่ใหม่</div>
            <input type="text" id="modalInput" class="modal-input" placeholder="ระบุชื่อหมวดหมู่...">
            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button class="modal-btn modal-btn-confirm" id="confirmModalBtn">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- Modal for Barcode Scanning -->
    <div id="barcodeScanModal" class="modal-overlay" style="display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div class="modal-card" style="text-align: center; max-width: 420px; padding: 36px 28px; display: flex; flex-direction: column; align-items: center;">
            <div style="font-size: 54px; color: var(--secondary-berry-hover); margin-bottom: 24px;" class="scan-icon-pulse">
                <i class="fas fa-barcode"></i>
            </div>
            <div class="modal-title" style="margin-bottom: 14px; font-size: 20px; font-weight: 700; color: #1e293b;">พร้อมรับสัญญาณสแกนบาร์โค้ด</div>
            <p style="color: #475569; font-size: 14px; line-height: 1.6; margin-bottom: 24px; margin-top: 0;">
                กรุณานำเครื่องสแกนเนอร์มายิงที่รหัสบาร์โค้ดของสินค้า<br>
                ระบบจะตรวจจับและนำเข้ารหัสโดยอัตโนมัติทันที
            </p>
            <input type="text" id="barcodeScanInput" style="opacity: 0; position: absolute; top: -1000px;" autocomplete="off">
            <div style="font-size: 12px; color: #10b981; font-weight: 600; background-color: #ecfdf5; padding: 4px 12px; border-radius: 20px; border: 1px solid #a7f3d0; margin-bottom: 20px; display: flex; align-items: center; gap: 6px;" id="scanStatusText">
                <i class="fas fa-circle" style="font-size: 8px; animation: pulseScan 1s infinite;"></i> ระบบเปิดช่องสัญญาณรอรับข้อมูล...
            </div>
            <button type="button" class="modal-btn modal-btn-cancel" onclick="closeBarcodeScanModal()" style="width: 100%; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; padding: 12px; border-radius: 8px; font-weight: 600; transition: all 0.2s;">ยกเลิก</button>
        </div>
    </div>

    <script>
        const productId = new URLSearchParams(window.location.search).get('id');
        let uploadMode = 'url';

        async function init() {
            await loadCategories();
            await loadPetTypes();
            const pTitle = document.getElementById('pageTitle');
            const mTitle = document.getElementById('mobileTitle');
            if (productId) {
                if (pTitle) pTitle.textContent = "Edit Product";
                if (mTitle) mTitle.textContent = "Edit Product";
                await loadProductData(productId);
            } else {
                if (pTitle) pTitle.textContent = "Add New Product";
                if (mTitle) mTitle.textContent = "Add New Product";
            }
        }

        async function loadCategories() {
            const res = await fetch('/api/categories');
            const result = await res.json();
            const select = document.getElementById('pCategory');
            select.innerHTML = '<option value="">-- Select Category --</option>' + 
                result.data.map(c => `<option value="${c.category_id}">${c.category_name}</option>`).join('');
        }

        async function loadPetTypes() {
            try {
                const res = await fetch('/api/pet-types');
                const result = await res.json();
                const select = document.getElementById('pTargetPetType');
                if (select && result.data) {
                    select.innerHTML = result.data.map(pt => `<option value="${pt.id}">${pt.name} (${pt.code})</option>`).join('');
                }
            } catch (e) {
                console.error("loadPetTypes error:", e);
            }
        }

        async function loadProductData(id) {
            const res = await fetch(`/api/products?id=${id}`);
            const result = await res.json();
            const p = result.data;
            
            document.getElementById('productId').value = p.product_id;
            document.getElementById('pName').value = p.product_name;
            document.getElementById('pCategory').value = p.category_id;
            if (p.target_pet_type_id) {
                document.getElementById('pTargetPetType').value = p.target_pet_type_id;
            }
            document.getElementById('pPrice').value = p.selling_price;
            document.getElementById('pCostPrice').value = p.cost_price;
            document.getElementById('pStock').value = p.stock_qty;
            document.getElementById('pWeightValue').value = p.weight_value !== null ? p.weight_value : '';
            document.getElementById('pWeightUnit').value = p.weight_unit || 'kg';
            document.getElementById('pBarcode').value = p.barcode;
            document.getElementById('pDesc').value = p.description;
            
            if (p.image_url) {
                previewImage(p.image_url);
                document.getElementById('pImageUrl').value = p.image_url;
            }
        }

        function switchUploadMode(mode) {
            uploadMode = mode;
            document.getElementById('modeUrl').classList.toggle('active', mode === 'url');
            document.getElementById('modeFile').classList.toggle('active', mode === 'file');
            document.getElementById('pImageUrl').style.display = mode === 'url' ? 'block' : 'none';
            document.getElementById('pImageFile').style.display = mode === 'file' ? 'block' : 'none';
        }

        function previewImage(url) {
            const img = document.getElementById('imgPreview');
            img.src = url || '/image/non-image.png';
            img.style.display = 'block';
        }

        function previewFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('imgPreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function addNewCategory() {
            const name = await showPromptModal("เพิ่มหมวดหมู่ใหม่", "ระบุชื่อหมวดหมู่...");
            if (!name) return;
            const res = await fetch('/api/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (res.ok) {
                const result = await res.json();
                const newId = result.data.id;
                showToast("เพิ่มหมวดหมู่สำเร็จ", "success");
                await loadCategories();
                if (newId) {
                    document.getElementById('pCategory').value = newId;
                }
            } else {
                showToast("ไม่สามารถเพิ่มหมวดหมู่ได้", "error");
            }
        }

        function showPromptModal(title, placeholder) {
            return new Promise((resolve) => {
                const modal = document.getElementById('promptModal');
                const titleEl = document.getElementById('modalTitle');
                const inputEl = document.getElementById('modalInput');
                const confirmBtn = document.getElementById('confirmModalBtn');

                titleEl.textContent = title;
                inputEl.placeholder = placeholder;
                inputEl.value = '';
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
                inputEl.focus();

                const handleConfirm = () => {
                    const value = inputEl.value.trim();
                    if (value) {
                        cleanup();
                        resolve(value);
                    }
                };

                const handleCancel = () => {
                    cleanup();
                    resolve(null);
                };

                const handleKey = (e) => {
                    if (e.key === 'Enter') handleConfirm();
                    if (e.key === 'Escape') handleCancel();
                };

                const cleanup = () => {
                    modal.classList.remove('show');
                    setTimeout(() => modal.style.display = 'none', 300);
                    confirmBtn.removeEventListener('click', handleConfirm);
                    document.querySelector('.modal-btn-cancel').removeEventListener('click', handleCancel);
                    document.removeEventListener('keydown', handleKey);
                };

                confirmBtn.addEventListener('click', handleConfirm);
                document.querySelector('.modal-btn-cancel').addEventListener('click', handleCancel);
                document.addEventListener('keydown', handleKey);
            });
        }

        function closeModal() {
            // This is just a fallback, the Promise handle handles the cleanup
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            // Calculate kg weight for shipping
            const val = parseFloat(document.getElementById('pWeightValue').value) || 0;
            const unit = document.getElementById('pWeightUnit').value;
            let kgWeight = 0;
            if (unit === 'kg' || unit === 'L') {
                kgWeight = val;
            } else if (unit === 'g' || unit === 'ml') {
                kgWeight = val / 1000;
            }
            formData.set('weight', kgWeight);
            
            // If in URL mode, make sure file is removed or clarified
            if (uploadMode === 'url') formData.set('image', '');

            const endpoint = productId ? '/api/products/update' : '/api/products';
            const res = await fetch(endpoint, {
                method: 'POST', // We use POST for both create and update to handle Multipart (files)
                body: formData
            });

            if (res.ok) {
                showToast("บันทึกข้อมูลสำเร็จ!", "success");
                setTimeout(() => window.location.href = 'admin_product_management.html', 1500);
            } else {
                const result = await res.json();
                showToast(result.message || "เกิดข้อผิดพลาด", "error");
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.getElementById('sidebarOverlay'); if (sidebar && overlay) { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); } }

        const hBtn = document.getElementById('hamburgerBtn'); if (hBtn) hBtn.addEventListener('click', toggleSidebar);
        const sOverlay = document.getElementById('sidebarOverlay'); if (sOverlay) sOverlay.addEventListener('click', toggleSidebar);

        function toggleSubmenu(el) {
            const group = el.closest('.menu-group');
            if (group) {
                group.classList.toggle('open');
                localStorage.setItem('productsMenuOpen', group.classList.contains('open'));
            }
        }

        // Restore submenu state
        document.addEventListener('DOMContentLoaded', () => {
            const menuGroup = document.querySelector('.menu-group');
            if (menuGroup) {
                const isOpen = localStorage.getItem('productsMenuOpen');
                if (isOpen === 'true') menuGroup.classList.add('open');
                else if (isOpen === 'false') menuGroup.classList.remove('open');
            }
        });

        const lBtn = document.getElementById('logoutBtn'); if (lBtn) lBtn.addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('user'); window.location.href = 'login.html'; });

        // --- Barcode Utilities ---
        function generateEAN13CheckDigit(digits12) {
            let sum = 0;
            for (let i = 0; i < 12; i++) {
                let digit = parseInt(digits12.charAt(i), 10);
                if (i % 2 === 0) {
                    sum += digit;
                } else {
                    sum += digit * 3;
                }
            }
            return (10 - (sum % 10)) % 10;
        }

        function generateRandomBarcode() {
            let code = "20";
            for (let i = 0; i < 10; i++) {
                code += Math.floor(Math.random() * 10);
            }
            code += generateEAN13CheckDigit(code);
            document.getElementById('pBarcode').value = code;
            showToast("สุ่มรหัสบาร์โค้ดสำเร็จ: " + code, "success");
        }

        let isScanning = false;
        let keepFocusInterval = null;

        function startBarcodeScan() {
            isScanning = true;
            const modal = document.getElementById('barcodeScanModal');
            const input = document.getElementById('barcodeScanInput');
            const statusText = document.getElementById('scanStatusText');
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            statusText.innerHTML = '<i class="fas fa-circle" style="font-size: 8px; animation: pulseScan 1.5s infinite;"></i> ระบบเปิดช่องสัญญาณรอรับข้อมูล...';
            input.value = '';
            
            setTimeout(() => input.focus(), 100);

            // Constantly keep focusing input
            keepFocusInterval = setInterval(() => {
                if (isScanning && document.activeElement !== input) {
                    input.focus();
                }
            }, 100);

            const handleInputKeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const barcode = input.value.trim();
                    if (barcode) {
                        document.getElementById('pBarcode').value = barcode;
                        showToast("สแกนบาร์โค้ดสำเร็จ: " + barcode, "success");
                        closeBarcodeScanModal();
                    }
                }
            };
            input.addEventListener('keydown', handleInputKeydown);

            modal.cleanup = () => {
                if (keepFocusInterval) {
                    clearInterval(keepFocusInterval);
                    keepFocusInterval = null;
                }
                input.removeEventListener('keydown', handleInputKeydown);
            };
        }

        function closeBarcodeScanModal() {
            isScanning = false;
            const modal = document.getElementById('barcodeScanModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
            if (modal.cleanup) {
                modal.cleanup();
            }
        }

        window.generateRandomBarcode = generateRandomBarcode;
        window.startBarcodeScan = startBarcodeScan;
        window.closeBarcodeScanModal = closeBarcodeScanModal;
        // -------------------------

        init();
    </script>
</body>
</html>

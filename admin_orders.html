<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการคำสั่งซื้อ - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .status-pill {
            padding: 6px 16px; 
            border-radius: 50px; 
            font-size: 13px; 
            font-weight: 500; 
            width: auto;
            min-width: 110px;
            text-align: center;
            display: inline-block;
        }
        .status-pill.pending { background-color: #fef08a; color: #854d0e; }
        .status-pill.processing { background-color: var(--secondary-berry-border); color: #1e3a8a; }
        .status-pill.intransit { background-color: #fce7f3; color: #9d174d; }
        .status-pill.completed { background-color: #dcfce7; color: #166534; }
        .status-pill.cancelled { background-color: #fecdd3; color: #9f1239; }
        
        .channel-pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .channel-pill.online {
            background-color: #e0f2fe;
            color: #0284c7;
            border: 1px solid #bae6fd;
        }
        .channel-pill.pos {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .order-tabs-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .order-tab-btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #64748b;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .order-tab-btn:hover {
            background: #f8fafc;
            color: #1e293b;
        }
        .order-tab-btn.active {
            background: var(--secondary-berry);
            color: #ffffff;
            border-color: var(--secondary-berry);
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }
        .order-tab-badge {
            background: rgba(255,255,255,0.25);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        .order-tab-btn:not(.active) .order-tab-badge {
            background: #f1f5f9;
            color: #475569;
        }

        .table-cell-text {
            color: #64748b;
            font-size: 14px;
        }
        .table-header span {
            color: #1e293b;
            font-weight: 600;
        }
        .search-container {
            background-color: #cce4f7;
            border-radius: 8px;
            border: none;
            margin-bottom: 24px;
        }
        .search-container input {
            background-color: transparent;
            color: #475569;
        }
        /* Order Row Layouts for Mobile */
        @media (max-width: 768px) {
            .order-row {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 12px;
                background: white;
                border-radius: 16px;
                padding: 20px;
                margin-bottom: 16px;
                border: 1px solid #f1f5f9;
                box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            }
            .order-date { grid-column: 1 / -1; color: #94a3b8; font-size: 13px; }
            .order-number { font-weight: 700; color: #1e293b; font-size: 15px; display: flex; align-items: center; justify-content: space-between; grid-column: 1 / -1; }
            .order-amount { font-weight: 600; color: var(--secondary-berry); text-align: left; }
            .order-status { display: flex; justify-content: flex-end; }
            .order-actions { display: none !important; }
            .stock-table { border: none; box-shadow: none; overflow: visible; background: transparent; }
            .table-header { display: none !important; }
            .desktop-only-cell { display: none !important; }
        }

        @media (min-width: 769px) {
            .order-row {
                display: flex;
                align-items: center;
                width: 100%;
                padding: 16px 25px;
                border-bottom: 1px solid #f1f5f9;
                transition: 0.2s;
            }
            .order-row:hover { background: #f8fafc; }
            .order-date { flex: 1.5; }
            .order-number { flex: 2; color: #334155; font-weight: 500; }
            .order-channel { flex: 1.5; display: flex; align-items: center; }
            .order-amount { flex: 1.5; text-align: left; }
            .order-status { flex: 1; display: flex; justify-content: center; }
            .order-actions { flex: 1; display: flex; justify-content: flex-end; }
            .mobile-only-pill { display: none !important; }
        }
    </style>

    <!-- Mobile User-Agent Check -->
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
    <script type="module" src="/src/js/main.js"></script>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-header"></header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>Orders</h1>
            </div>

            <!-- Tabs Filter -->
            <div class="order-tabs-container">
                <button type="button" class="order-tab-btn active" id="tabBtnAll" onclick="window.setOrderTypeFilter('all')">
                    <i class="fas fa-list"></i> ทั้งหมด <span class="order-tab-badge" id="badgeAll">0</span>
                </button>
                <button type="button" class="order-tab-btn" id="tabBtnOnline" onclick="window.setOrderTypeFilter('online')">
                    <i class="fas fa-globe"></i> คำสั่งซื้อออนไลน์ <span class="order-tab-badge" id="badgeOnline">0</span>
                </button>
                <button type="button" class="order-tab-btn" id="tabBtnPos" onclick="window.setOrderTypeFilter('pos')">
                    <i class="fas fa-store"></i> ขายหน้าร้าน (POS) <span class="order-tab-badge" id="badgePos">0</span>
                </button>
            </div>

            <!-- Search & Filter -->
            <div class="search-container" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: none; box-shadow: none; padding: 0; margin-bottom: 24px;">
                <div style="display: flex; align-items: center; flex: 1.5; min-width: 250px; position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 16px; color: #94a3b8; z-index: 10;"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาตามรหัสคำสั่งซื้อ, สถานะ หรือช่องทาง..." style="padding-left: 45px; width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; height: 46px; outline: none; font-size: 14px; background: #f8fafc; transition: all 0.2s;">
                </div>
                <select id="statusFilterSelect" style="padding: 0 16px; height: 46px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 500; color: #475569; background-color: #f8fafc; outline: none; min-width: 180px; cursor: pointer; transition: all 0.2s;">
                    <option value="all">สถานะทั้งหมด (All)</option>
                    <option value="unfulfilled">📦 ที่ต้องดำเนินการ (Unfulfilled)</option>
                    <option value="Pending">⏳ Pending (รอดำเนินการ)</option>
                    <option value="Processing">⚙️ Processing (กำลังแพ็คสินค้า)</option>
                    <option value="In Transit">🚚 In Transit (กำลังจัดส่ง)</option>
                    <option value="Completed">✅ Completed (จัดส่งสำเร็จ)</option>
                    <option value="Cancelled">❌ Cancelled (ยกเลิกแล้ว)</option>
                </select>
                <!-- Month Filter -->
                <select id="monthFilterSelect" style="padding: 0 16px; height: 46px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 500; color: #475569; background-color: #f8fafc; outline: none; min-width: 180px; cursor: pointer; transition: all 0.2s;">
                    <option value="all">เดือนทั้งหมด (All Months)</option>
                </select>
                <!-- Date Range Filter -->
                <div class="date-range-box" style="display: flex; align-items: center; gap: 8px; border: 1px solid #e2e8f0; padding: 0 16px; height: 46px; border-radius: 12px; background-color: #f8fafc;">
                    <span style="font-size: 14px; font-weight: 500; color: #64748b; white-space: nowrap;">ช่วงวันที่:</span>
                    <input type="date" id="startDateFilterInput" style="border: none; background: transparent; font-size: 14px; font-weight: 500; color: #475569; outline: none; cursor: pointer; width: 130px; height: 100%;" title="วันเริ่มต้น">
                    <span style="color: #cbd5e1; font-weight: 300;">ถึง</span>
                    <input type="date" id="endDateFilterInput" style="border: none; background: transparent; font-size: 14px; font-weight: 500; color: #475569; outline: none; cursor: pointer; width: 130px; height: 100%;" title="วันสิ้นสุด">
                </div>
                <button type="button" id="clearAllFiltersBtn" style="border: 1px solid #e2e8f0; background: white; color: #64748b; height: 46px; padding: 0 16px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s;" title="ล้างตัวกรอง">
                    <i class="fas fa-undo"></i> ล้างตัวกรอง
                </button>
            </div>

            <!-- Table -->
            <div class="stock-table">
                <div class="table-header">
                    <span style="flex: 1.5;">วันที่สั่งซื้อ</span>
                    <span style="flex: 2;">หมายเลขคำสั่งซื้อ</span>
                    <span style="flex: 1.5;">ช่องทาง</span>
                    <span style="flex: 1.5; text-align: left;">ยอดรวม</span>
                    <span style="flex: 1; text-align: center;">สถานะ</span>
                    <span style="flex: 1; text-align: right;">จัดการ</span>
                </div>
                <div id="ordersContainer">
                    <div class="loading-container">
                        <div class="spinner-loader"></div>
                        <span>กำลังโหลดข้อมูล...</span>
                    </div>
                </div>
            </div>
            <!-- Pagination -->
            <div id="paginationContainer" class="pagination-container"></div>
        </main>

        <!-- Bottom Navigation for Mobile -->
        <nav class="bottom-nav"></nav>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        (function() {
            let allOrders = [];
            let filteredOrders = [];
            let currentPage = 1;
            const itemsPerPage = 20;
            const urlParams = new URLSearchParams(window.location.search);
            let currentTypeFilter = urlParams.get('type') || 'all';

            window.setOrderTypeFilter = function(type) {
                currentTypeFilter = type;
                currentPage = 1;
                updateTabUI();
                renderOrders();
            };

            function updateTabUI() {
                const tabs = {
                    all: document.getElementById('tabBtnAll'),
                    online: document.getElementById('tabBtnOnline'),
                    pos: document.getElementById('tabBtnPos')
                };
                Object.keys(tabs).forEach(k => {
                    if (tabs[k]) {
                        if (k === currentTypeFilter) tabs[k].classList.add('active');
                        else tabs[k].classList.remove('active');
                    }
                });
            }

            function updateBadges() {
                const countAll = allOrders.length;
                const countOnline = allOrders.filter(o => (o.order_type || 1) === 1).length;
                const countPos = allOrders.filter(o => o.order_type === 2).length;

                const bAll = document.getElementById('badgeAll');
                const bOnline = document.getElementById('badgeOnline');
                const bPos = document.getElementById('badgePos');

                if (bAll) bAll.textContent = countAll;
                if (bOnline) bOnline.textContent = countOnline;
                if (bPos) bPos.textContent = countPos;
            }

            function mapCustomerStatusToAdmin(st) {
                if (st === 'Pending Payment' || st === 'ที่ต้องชำระ') return 'Pending';
                if (st === 'Preparing' || st === 'ที่ต้องจัดส่ง' || st === 'กำลังเตรียมสินค้า') return 'Processing';
                if (st === 'Shipping' || st === 'ที่ต้องได้รับ' || st === 'กำลังจัดส่ง') return 'In Transit';
                if (st === 'Completed' || st === 'สำเร็จแล้ว' || st === 'สำเร็จ') return 'Completed';
                if (st === 'Cancelled' || st === 'ยกเลิกแล้ว') return 'Cancelled';
                return st || 'Pending';
            }

            function formatOrderDate(dateInput) {
                if (!dateInput) return '-';
                let d;
                if (typeof dateInput === 'string') {
                    let s = dateInput.trim();
                    if (s.includes(' ') && !s.includes('T')) {
                        s = s.replace(' ', 'T');
                    }
                    d = new Date(s);
                } else {
                    d = new Date(dateInput);
                }
                if (isNaN(d.getTime())) return dateInput;
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear() + 543;
                const hours = String(d.getHours()).padStart(2, '0');
                const minutes = String(d.getMinutes()).padStart(2, '0');
                return `${day}/${month}/${year} ${hours}:${minutes}`;
            }

            async function fetchOrders() {
                try {
                    let apiOrders = [];
                    try {
                        const res = await fetch('/api/orders');
                        if (res.ok) {
                            const json = await res.json();
                            apiOrders = json.data || [];
                        }
                    } catch (e) {
                        console.warn("API order fetch warning:", e);
                    }

                    // Load customer frontend orders from localStorage
                    const myOrders = JSON.parse(localStorage.getItem('myOrders') || '[]');
                    const localMapped = myOrders.map(o => {
                        let pDate = o.date;
                        if (typeof pDate === 'string' && pDate.includes(' ') && !pDate.includes('T')) {
                            pDate = pDate.replace(' ', 'T');
                        }
                        const dateObj = pDate ? new Date(pDate) : new Date();
                        return {
                            id: o.id,
                            date: formatOrderDate(pDate || dateObj),
                            timestamp: dateObj.getTime(),
                            rawDate: dateObj,
                            number: o.number || `ORD-2026-${String(o.id).padStart(3, '0')}`,
                            status: mapCustomerStatusToAdmin(o.status),
                            order_type: o.order_type || 1,
                            order_type_label: o.order_type_label || 'ออนไลน์',
                            amount: parseFloat(o.total || o.amount || 0),
                            customer: o.customer || { name: o.shippingAddress?.fullName || 'ลูกค้าออนไลน์', email: 'customer@example.com', phone: o.shippingAddress?.phone || '-', address: o.shippingAddress ? `${o.shippingAddress.address} ${o.shippingAddress.province}` : '-' }
                        };
                    });

                    const localIdMap = new Map(localMapped.map(item => [String(item.id), item]));
                    apiOrders.forEach(ao => {
                        if (!localIdMap.has(String(ao.id))) {
                            let pDate = ao.date;
                            if (typeof pDate === 'string' && pDate.includes(' ') && !pDate.includes('T')) {
                                pDate = pDate.replace(' ', 'T');
                            }
                            const dateObj = pDate ? new Date(pDate) : new Date();
                            localIdMap.set(String(ao.id), {
                                id: ao.id,
                                date: formatOrderDate(pDate || dateObj),
                                timestamp: dateObj.getTime(),
                                rawDate: dateObj,
                                number: ao.number,
                                status: ao.status,
                                order_type: ao.order_type || 1,
                                order_type_label: ao.order_type_label,
                                amount: parseFloat(ao.amount)
                            });
                        }
                    });

                    allOrders = Array.from(localIdMap.values());
                    allOrders.sort((a, b) => b.timestamp - a.timestamp);
                    currentPage = 1;
                    updateBadges();
                    updateTabUI();
                    renderOrders();
                } catch (e) {
                    console.error(e);
                    const container = document.getElementById('ordersContainer');
                    if (container) container.innerHTML = '<div style="padding: 50px; text-align: center; color: #ef4444;">เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
                }
            }

            function checkAuth() {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user || user.role_name.toLowerCase() !== 'admin') {
                    window.location.href = 'login.html';
                }
            }

            function getStatusLabel(status) {
                if (!status) return 'รอดำเนินการ';
                const s = status.toString().trim();
                if (s === 'Pending' || s === 'รอดำเนินการ' || s === 'Pending Payment' || s === 'ที่ต้องชำระ') return 'รอดำเนินการ';
                if (s === 'Processing' || s === 'กำลังแพ็คสินค้า' || s === 'กำลังดำเนินการ' || s === 'Preparing' || s === 'ที่ต้องจัดส่ง') return 'กำลังแพ็คสินค้า';
                if (s === 'In Transit' || s === 'กำลังจัดส่ง' || s === 'กำลังนำส่ง' || s === 'Shipping' || s === 'ที่ต้องได้รับ' || s === 'มอบให้ขนส่งแล้ว') return 'กำลังจัดส่ง';
                if (s === 'Completed' || s === 'สำเร็จแล้ว' || s === 'สำเร็จ' || s === 'ลูกค้าได้รับสินค้า') return 'สำเร็จแล้ว';
                if (s === 'Cancelled' || s === 'ยกเลิกแล้ว' || s === 'ยกเลิก') return 'ยกเลิกแล้ว';
                return status;
            }

            function getStatusClass(status) {
                if (!status) return 'pending';
                const s = status.toString().trim();
                if (s === 'Pending' || s === 'รอดำเนินการ' || s === 'Pending Payment' || s === 'ที่ต้องชำระ') return 'pending';
                if (s === 'Processing' || s === 'กำลังแพ็คสินค้า' || s === 'กำลังดำเนินการ' || s === 'Preparing' || s === 'ที่ต้องจัดส่ง') return 'processing';
                if (s === 'In Transit' || s === 'กำลังจัดส่ง' || s === 'กำลังนำส่ง' || s === 'Shipping' || s === 'ที่ต้องได้รับ' || s === 'มอบให้ขนส่งแล้ว') return 'intransit';
                if (s === 'Completed' || s === 'สำเร็จแล้ว' || s === 'สำเร็จ' || s === 'ลูกค้าได้รับสินค้า') return 'completed';
                if (s === 'Cancelled' || s === 'ยกเลิกแล้ว' || s === 'ยกเลิก') return 'cancelled';
                return s.toLowerCase().replace(/\s+/g, '');
            }

            function renderOrders() {
                const container = document.getElementById('ordersContainer');
                const paginationContainer = document.getElementById('paginationContainer');
                const searchInput = document.getElementById('searchInput');
                if (!container || !searchInput) return;
                
                const keyword = searchInput.value.toLowerCase();
                const statusFilter = document.getElementById('statusFilterSelect').value;
                
                const monthFilter = document.getElementById('monthFilterSelect')?.value || 'all';
                const startDateFilter = document.getElementById('startDateFilterInput')?.value || '';
                const endDateFilter = document.getElementById('endDateFilterInput')?.value || '';

                filteredOrders = allOrders.filter(o => {
                    const statusLabel = getStatusLabel(o.status);
                    const matchesKeyword = o.number.toLowerCase().includes(keyword) || 
                                           o.status.toLowerCase().includes(keyword) ||
                                           statusLabel.toLowerCase().includes(keyword) ||
                                           (o.order_type_label && o.order_type_label.toLowerCase().includes(keyword)) ||
                                           o.date.includes(keyword);
                    
                    if (!matchesKeyword) return false;

                    if (currentTypeFilter === 'online' && (o.order_type || 1) !== 1) return false;
                    if (currentTypeFilter === 'pos' && o.order_type !== 2) return false;

                    if (statusFilter !== 'all') {
                        if (statusFilter === 'unfulfilled') {
                            const unfulfilledStatuses = ['Pending', 'Processing', 'In Transit', 'รอดำเนินการ', 'กำลังดำเนินการ', 'กำลังจัดส่ง'];
                            if (!unfulfilledStatuses.includes(o.status)) return false;
                        } else {
                            if (o.status !== statusFilter) return false;
                        }
                    }

                    if (monthFilter !== 'all' && o.rawDate) {
                        const orderYear = o.rawDate.getFullYear();
                        const orderMonth = String(o.rawDate.getMonth() + 1).padStart(2, '0');
                        const orderMonthStr = `${orderYear}-${orderMonth}`;
                        if (orderMonthStr !== monthFilter) return false;
                    }

                    if (o.rawDate) {
                        const orderYear = o.rawDate.getFullYear();
                        const orderMonth = String(o.rawDate.getMonth() + 1).padStart(2, '0');
                        const orderDay = String(o.rawDate.getDate()).padStart(2, '0');
                        const orderDateStr = `${orderYear}-${orderMonth}-${orderDay}`;
                        
                        if (startDateFilter !== '' && orderDateStr < startDateFilter) return false;
                        if (endDateFilter !== '' && orderDateStr > endDateFilter) return false;
                    }
                    return true;
                });

                if (filteredOrders.length === 0) {
                    container.innerHTML = '<div style="padding: 50px; text-align: center; color: #718096;">ไม่พบคำสั่งซื้อ</div>';
                    if (paginationContainer) paginationContainer.innerHTML = '';
                    return;
                }

                // Pagination boundaries check
                const totalPages = Math.ceil(filteredOrders.length / itemsPerPage);
                if (currentPage > totalPages) {
                    currentPage = totalPages;
                }
                if (currentPage < 1) {
                    currentPage = 1;
                }

                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const paginatedOrders = filteredOrders.slice(startIndex, endIndex);

                container.innerHTML = paginatedOrders.map(o => `
                    <div class="order-row" onclick="(window.navigateTo ? window.navigateTo('admin_order_details.html?id=${o.id}') : window.location.href='admin_order_details.html?id=${o.id}')" style="cursor: pointer;">
                        <div class="order-date">${o.date}</div>
                        <div class="order-number">
                            <span>${o.number}</span>
                            <span class="channel-pill ${o.order_type === 2 ? 'pos' : 'online'} mobile-only-pill">
                                <i class="fas ${o.order_type === 2 ? 'fa-store' : 'fa-globe'}"></i> ${o.order_type_label}
                            </span>
                        </div>
                        <div class="order-channel desktop-only-cell">
                            <span class="channel-pill ${o.order_type === 2 ? 'pos' : 'online'}">
                                <i class="fas ${o.order_type === 2 ? 'fa-store' : 'fa-globe'}"></i> ${o.order_type_label}
                            </span>
                        </div>
                        <div class="order-amount">฿${Number(o.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                        <div class="order-status">
                            <span class="status-pill ${getStatusClass(o.status)}">${getStatusLabel(o.status)}</span>
                        </div>
                        <div class="order-actions desktop-action">
                            <a href="admin_order_details.html?id=${o.id}" class="action-link" style="width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; background-color: var(--secondary-berry-light); color: var(--secondary-berry); font-size: 16px; text-decoration: none; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" title="View Order Details">
                                <i class="fas fa-eye"></i>
                            </a>
                        </div>
                    </div>
                `).join('');

                renderPagination(filteredOrders.length);
            }

            function renderPagination(totalItems) {
                const paginationContainer = document.getElementById('paginationContainer');
                if (!paginationContainer) return;

                const totalPages = Math.ceil(totalItems / itemsPerPage);
                if (totalPages <= 1) {
                    paginationContainer.innerHTML = '';
                    return;
                }

                let html = '';
                
                // Previous button
                html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.changePage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;

                // Page numbers
                const maxVisiblePages = 5;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
                let endPage = startPage + maxVisiblePages - 1;

                if (endPage > totalPages) {
                    endPage = totalPages;
                    startPage = Math.max(1, endPage - maxVisiblePages + 1);
                }

                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="window.changePage(${i})">${i}</button>`;
                }

                // Next button
                html += `<button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="window.changePage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;

                paginationContainer.innerHTML = html;
            }

            function changePage(page) {
                currentPage = page;
                renderOrders();
            }

            window.changePage = changePage;

            const populateMonthFilter = () => {
                const select = document.getElementById('monthFilterSelect');
                if (!select) return;

                const monthsThai = [
                    'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
                ];

                const now = new Date();
                const currentYear = now.getFullYear();

                let optionsHtml = '<option value="all">เดือนทั้งหมด (All Months)</option>';
                for (let m = 0; m < 12; m++) {
                    const value = `${currentYear}-${String(m + 1).padStart(2, '0')}`;
                    const label = `${monthsThai[m]} ${currentYear + 543}`;
                    optionsHtml += `<option value="${value}">${label}</option>`;
                }
                select.innerHTML = optionsHtml;
            };

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    currentPage = 1;
                    renderOrders();
                });
            }

            const statusFilterSelect = document.getElementById('statusFilterSelect');
            if (statusFilterSelect) {
                statusFilterSelect.addEventListener('change', () => {
                    currentPage = 1;
                    renderOrders();
                });
            }

            const monthFilterSelect = document.getElementById('monthFilterSelect');
            if (monthFilterSelect) {
                monthFilterSelect.addEventListener('change', () => {
                    currentPage = 1;
                    renderOrders();
                });
            }

            const startDateFilterInput = document.getElementById('startDateFilterInput');
            if (startDateFilterInput) {
                startDateFilterInput.addEventListener('change', () => {
                    currentPage = 1;
                    renderOrders();
                });
            }

            const endDateFilterInput = document.getElementById('endDateFilterInput');
            if (endDateFilterInput) {
                endDateFilterInput.addEventListener('change', () => {
                    currentPage = 1;
                    renderOrders();
                });
            }

            const clearAllFiltersBtn = document.getElementById('clearAllFiltersBtn');
            if (clearAllFiltersBtn) {
                clearAllFiltersBtn.addEventListener('click', () => {
                    if (monthFilterSelect) monthFilterSelect.value = 'all';
                    if (startDateFilterInput) startDateFilterInput.value = '';
                    if (endDateFilterInput) endDateFilterInput.value = '';
                    currentPage = 1;
                    renderOrders();
                });
            }

            // Initialize page logic
            checkAuth();
            populateMonthFilter();
            fetchOrders();
        })();
    </script>
</body>
</html>

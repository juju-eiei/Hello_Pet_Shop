<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - Hello Pet Shop</title>
    <!-- Use Vite to load styles -->
    <script type="module" src="/src/js/main.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', 'Kanit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-gradient-to-br from-primary-50 to-primary-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-4 sm:px-8 py-4 sm:py-6">
        <div class="flex items-center space-x-2 text-primary-600 flex-shrink-0">
            <div class="w-8 h-8 sm:w-10 sm:h-10 bg-secondary-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                <i class="fas fa-paw text-lg sm:text-xl"></i>
            </div>
            <span class="text-lg sm:text-2xl font-bold tracking-tight text-gray-800 whitespace-nowrap hidden sm:inline-block">Hello Pet Shop</span>
            <span class="text-xl font-bold tracking-tight text-gray-800 whitespace-nowrap sm:hidden">Pet Shop</span>
        </div>
        <div class="flex items-center space-x-3 sm:space-x-6">
            <a href="products.html" class="text-sm sm:text-base text-gray-600 hover:text-primary-600 font-medium transition-colors whitespace-nowrap">สินค้า</a>
            <a href="login.html" class="whitespace-nowrap text-sm sm:text-base px-4 py-2 sm:px-5 sm:py-2.5 bg-secondary-600 text-white rounded-lg font-semibold shadow-md hover:shadow-lg hover:bg-secondary-700 transition-all">เข้าสู่ระบบ</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 sm:py-12">
        <div class="glass w-full max-w-md p-6 sm:p-8 rounded-2xl sm:rounded-3xl shadow-2xl space-y-6 sm:space-y-8">
            <div id="formContainer">
                <div class="text-center space-y-2 mb-6 sm:mb-8">
                    <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">ตั้งรหัสผ่านใหม่</h2>
                    <p class="text-gray-500 text-sm sm:text-base">กรุณากรอกรหัสผ่านใหม่ที่คุณต้องการใช้งาน</p>
                </div>

                <form id="resetForm" class="space-y-6">
                    <!-- Hidden Token Field -->
                    <input type="hidden" name="token" id="tokenField">

                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-700 ml-1">รหัสผ่านใหม่</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="password" name="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6"
                                class="w-full pl-11 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all shadow-sm">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-700 ml-1">ยืนยันรหัสผ่านใหม่</label>
                        <div class="relative">
                            <i class="fas fa-check-double absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="password" name="confirm_password" id="confirm_password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" required
                                class="w-full pl-11 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all shadow-sm">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-4 bg-secondary-600 text-white rounded-xl font-bold shadow-lg hover:shadow-secondary-200 hover:bg-secondary-700 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
                        <span>บันทึกรหัสผ่านใหม่</span>
                        <i class="fas fa-key text-sm"></i>
                    </button>
                </form>
            </div>

            <!-- Error State UI -->
            <div id="errorState" class="hidden text-center space-y-6 py-4">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="space-y-2">
                    <h3 class="text-xl font-bold text-gray-900">เกิดข้อผิดพลาด</h3>
                    <p id="errorText" class="text-gray-500">ลิงก์รีเซ็ทรหัสผ่านนี้ไม่ถูกต้องหรือไม่สมบูรณ์</p>
                </div>
                <a href="/forgot-password" class="inline-block px-6 py-3 bg-secondary-600 text-white font-semibold rounded-xl shadow-md hover:bg-secondary-700 transition-colors">
                    ขอลิงก์รีเซ็ทรหัสผ่านใหม่
                </a>
            </div>
        </div>
    </main>

    <!-- Toast Component -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl shadow-xl transition-all duration-500 opacity-0 translate-y-4 pointer-events-none z-50"></div>

    <script type="module">
        import { showToast } from '/src/js/utils.js';

        // Extract token from URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const formContainer = document.getElementById('formContainer');
        const errorState = document.getElementById('errorState');
        const errorText = document.getElementById('errorText');
        const tokenField = document.getElementById('tokenField');

        if (!token) {
            formContainer.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorText.textContent = "ไม่พบโทเค็นสำหรับการรีเซ็ทรหัสผ่าน";
        } else {
            tokenField.value = token;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                showToast("รหัสผ่านใหม่ไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง", "error");
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    showToast("เปลี่ยนรหัสผ่านสำเร็จแล้ว! กำลังนำทางไปหน้าเข้าสู่ระบบ...", "success");
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showToast(result.message || "เกิดข้อผิดพลาดในการเปลี่ยนรหัสผ่าน", "error");
                    if (result.message && (result.message.includes("ไม่ถูกต้อง") || result.message.includes("หมดอายุ"))) {
                        setTimeout(() => {
                            formContainer.classList.add('hidden');
                            errorState.classList.remove('hidden');
                            errorText.textContent = result.message;
                        }, 1500);
                    }
                }
            } catch (error) {
                showToast("การเชื่อมต่อล้มเหลว", "error");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าสิทธิ์การใช้งาน - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Outfit', 'Kanit', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .permission-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .permission-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(49, 77, 42, 0.08);
            border-color: rgba(148, 173, 94, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1.5px solid #f1f5f9;
            padding-bottom: 12px;
            color: var(--primary-green);
        }

        .card-header i {
            font-size: 20px;
        }

        .card-header h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
        }

        .permission-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .permission-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: background-color 0.2s;
        }

        .permission-item:hover {
            background-color: rgba(241, 245, 249, 0.6);
        }

        .permission-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            accent-color: var(--primary-green);
            margin-top: 2px;
        }

        .permission-label {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .permission-title {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .permission-desc {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Role Selector Row */
        .role-selector {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .role-btn {
            flex: 1;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 24px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.01);
        }

        .role-btn:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
            transform: translateY(-1px);
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--primary-green) 0%, #476a3d 100%);
            border-color: var(--primary-green);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(49, 77, 42, 0.2);
        }

        .role-btn i {
            font-size: 18px;
        }

        .save-bar {
            display: flex;
            justify-content: flex-end;
            margin-top: 32px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #e2e8f0;
            padding: 16px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .btn-save-perms {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(49, 77, 42, 0.2);
        }

        .btn-save-perms:hover {
            background: #1a2a18;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(49, 77, 42, 0.3);
        }

        @media (max-width: 640px) {
            .role-selector {
                flex-direction: column;
            }
            .permissions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script type="module" src="/src/js/main.js"></script>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <header class="mobile-header"></header>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header" style="margin-bottom: 24px;">
                <h1 data-i18n="nav.permissions">ตั้งค่าระดับสิทธิ์การเข้าถึง</h1>
                <p style="color: #64748b; font-size: 14px; margin-top: 4px;">จัดการกำหนดสิทธิ์เข้าถึงโมดูลและฟังก์ชันการใช้งานของแต่ละบทบาท</p>
            </div>

            <!-- Role Switcher -->
            <div class="role-selector">
                <button type="button" class="role-btn active" id="roleBtnAdmin" onclick="selectRole(1)">
                    <i class="fas fa-user-shield"></i>
                    <span>Admin / ผู้ดูแลระบบ</span>
                </button>
                <button type="button" class="role-btn" id="roleBtnEmployee" onclick="selectRole(2)">
                    <i class="fas fa-users-cog"></i>
                    <span>Employee / พนักงานทั่วไป</span>
                </button>
                <button type="button" class="role-btn" id="roleBtnCustomer" onclick="selectRole(3)">
                    <i class="fas fa-users"></i>
                    <span>Customer / ลูกค้า</span>
                </button>
            </div>

            <!-- Permissions Checklist Grid -->
            <div class="permissions-grid">
                <!-- Group 1: Core System -->
                <div class="permission-card">
                    <div class="card-header">
                        <i class="fas fa-lock"></i>
                        <h3>ระบบหลักและความปลอดภัย</h3>
                    </div>
                    <div class="permission-list">
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="auth_access" id="perm_auth_access">
                            <div class="permission-label">
                                <span class="permission-title">ระบบเข้าสู่ระบบ (auth_access)</span>
                                <span class="permission-desc">สามารถเข้าสู่ระบบร้านค้าด้วยบัญชีพนักงานได้</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="password_reset" id="perm_password_reset">
                            <div class="permission-label">
                                <span class="permission-title">รีเซ็ทรหัสผ่าน (password_reset)</span>
                                <span class="permission-desc">สามารถขอลิงก์รีเซ็ทรหัสผ่านใหม่ผ่านอีเมลได้</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Group 2: POS & Orders -->
                <div class="permission-card">
                    <div class="card-header">
                        <i class="fas fa-cash-register"></i>
                        <h3>ขายหน้าร้านและการขาย</h3>
                    </div>
                    <div class="permission-list">
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="pos_access" id="perm_pos_access">
                            <div class="permission-label">
                                <span class="permission-title">ขายหน้าร้าน POS (pos_access)</span>
                                <span class="permission-desc">เข้าสู่ระบบการขายหน้าร้าน รับเงิน และออกใบเสร็จ</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="orders_manage" id="perm_orders_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการคำสั่งซื้อ (orders_manage)</span>
                                <span class="permission-desc">ดูประวัติออเดอร์ ยืนยันสลิป และอัปเดตสเตตัสการขาย</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Group 3: Inventory & Stock -->
                <div class="permission-card">
                    <div class="card-header">
                        <i class="fas fa-warehouse"></i>
                        <h3>คลังสินค้าและหมวดหมู่</h3>
                    </div>
                    <div class="permission-list">
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="stock_view" id="perm_stock_view">
                            <div class="permission-label">
                                <span class="permission-title">ดูคลังสินค้า (stock_view)</span>
                                <span class="permission-desc">สามารถเข้าดูปริมาณสต็อกคงเหลือของแต่ละสินค้าได้</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="stock_manage" id="perm_stock_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการคลังสินค้า (stock_manage)</span>
                                <span class="permission-desc">แก้ไขปริมาณสต็อกสินค้า รับของเข้า และดูประวัติสต็อก</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="stock_alerts" id="perm_stock_alerts">
                            <div class="permission-label">
                                <span class="permission-title">ระบบแจ้งเตือนคลัง (stock_alerts)</span>
                                <span class="permission-desc">ดูระบบแจ้งเตือนสินค้าใกล้หมดสต็อก และสินค้าใกล้หมดอายุ</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="products_manage" id="perm_products_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการสินค้า & หมวดหมู่ (products_manage)</span>
                                <span class="permission-desc">เพิ่ม แก้ไข ลบโครงสร้างตัวสินค้า หมวดหมู่ และบาร์โค้ด</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Group 4: Customers & Pets -->
                <div class="permission-card">
                    <div class="card-header">
                        <i class="fas fa-paw"></i>
                        <h3>ข้อมูลลูกค้าและสัตว์เลี้ยง</h3>
                    </div>
                    <div class="permission-list">
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="customers_view" id="perm_customers_view">
                            <div class="permission-label">
                                <span class="permission-title">ดูข้อมูลและแต้มสะสม (customers_view)</span>
                                <span class="permission-desc">ดูคะแนนสะสม และประวัติลูกค้าเพื่อแนะนำสิทธิ์และส่วนลด</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="customers_manage" id="perm_customers_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการลูกค้า (customers_manage)</span>
                                <span class="permission-desc">จัดการเพิ่ม/แก้ไข/ลบข้อมูลบัญชีของลูกค้าในระบบ</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="pets_manage" id="perm_pets_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการสัตว์เลี้ยง (pets_manage)</span>
                                <span class="permission-desc">เพิ่ม แก้ไข หรือลบข้อมูลและประวัติสัตว์เลี้ยงของลูกค้า</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Group 5: Delivery & Shipping -->
                <div class="permission-card">
                    <div class="card-header">
                        <i class="fas fa-truck"></i>
                        <h3>การจัดส่งและการขนส่ง</h3>
                    </div>
                    <div class="permission-list">
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="delivery_view" id="perm_delivery_view">
                            <div class="permission-label">
                                <span class="permission-title">ดูระบบการส่ง (delivery_view)</span>
                                <span class="permission-desc">ดูสเตตัส บริษัทขนส่ง และอัตราค่าบริการจัดส่งได้</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="delivery_manage" id="perm_delivery_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการขนส่ง (delivery_manage)</span>
                                <span class="permission-desc">อัปเดตสถานะจัดส่ง กรอกเลขพัสดุ และเพิ่มลบเรตค่าส่ง</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Group 6: Marketing, Staff & Admin Settings -->
                <div class="permission-card">
                    <div class="card-header">
                        <i class="fas fa-sliders-h"></i>
                        <h3>การตั้งค่า & การตลาด</h3>
                    </div>
                    <div class="permission-list">
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="dashboard_view" id="perm_dashboard_view">
                            <div class="permission-label">
                                <span class="permission-title">ดูรายงานการเงิน (dashboard_view)</span>
                                <span class="permission-desc">สิทธิ์การเข้าชมรายงานทางการเงิน ยอดขาย และแดชบอร์ด</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="promotions_view" id="perm_promotions_view">
                            <div class="permission-label">
                                <span class="permission-title">ดูโปรโมชั่นข่าวสาร (promotions_view)</span>
                                <span class="permission-desc">สิทธิ์สำหรับพนักงานเพื่อเปิดดูรายละเอียดโปรโมชั่น</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="promotions_manage" id="perm_promotions_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการโปรโมชั่น (promotions_manage)</span>
                                <span class="permission-desc">สร้าง แก้ไข ลบแคมเปญโปรโมชั่น ส่วนลด และคูปอง</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="rewards_view" id="perm_rewards_view">
                            <div class="permission-label">
                                <span class="permission-title">ดูแต้มสะสม & รางวัล (rewards_view)</span>
                                <span class="permission-desc">ดูอัตราการแปลงคะแนนสะสม และกฎการแถมของรางวัล</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="rewards_manage" id="perm_rewards_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการแต้ม & รางวัล (rewards_manage)</span>
                                <span class="permission-desc">ตั้งค่าอัตราคะแนนสะสม และกฎแลกซื้อ/แถมของรางวัล</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="staff_profile_manage" id="perm_staff_profile_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการโปรไฟล์ตนเอง (staff_profile_manage)</span>
                                <span class="permission-desc">แก้ไขข้อมูลการติดต่อและบัญชีของตนเองได้</span>
                            </div>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permission" value="staff_manage" id="perm_staff_manage">
                            <div class="permission-label">
                                <span class="permission-title">จัดการข้อมูลพนักงาน (staff_manage)</span>
                                <span class="permission-desc">สิทธิ์แอดมินสำหรับการเพิ่ม/แก้ไข/ลบ และกำหนดสิทธิ์พนักงาน</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Save Bar -->
            <div class="save-bar">
                <button type="button" class="btn-save-perms" onclick="savePermissions()">
                    <i class="fas fa-save"></i>
                    <span>บันทึกการตั้งค่าสิทธิ์</span>
                </button>
            </div>
        </main>
    </div>

    <script>
        let currentSelectedRoleId = 1;
        let allRolesData = [];

        async function init() {
            await checkAuth();
            await fetchRolePermissions();
            updateRoleUI();
        }

        async function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role_name.toLowerCase() !== 'admin') {
                window.location.href = 'login.html';
            }
        }

        async function fetchRolePermissions() {
            try {
                const res = await fetch('/api/roles/permissions');
                const result = await res.json();
                if (res.ok) {
                    allRolesData = result.data || [];
                    loadRolePermissionsIntoCheckboxes(currentSelectedRoleId);
                } else {
                    Swal.fire('ข้อผิดพลาด', result.message || 'ไม่สามารถโหลดข้อมูลสิทธิ์การใช้งานได้', 'error');
                }
            } catch (err) {
                console.error("Error loading permissions:", err);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }
        }

        function loadRolePermissionsIntoCheckboxes(roleId) {
            const role = allRolesData.find(r => r.role_id == roleId);
            const perms = role ? role.permissions : [];

            // Reset all checkboxes first
            document.querySelectorAll('input[name="permission"]').forEach(cb => {
                cb.checked = false;
                // If role is Admin (roleId = 1), lock all checkboxes to true (Admin has all perms by default)
                if (roleId == 1) {
                    cb.checked = true;
                    cb.disabled = true;
                } else {
                    cb.disabled = false;
                    if (perms.includes(cb.value)) {
                        cb.checked = true;
                    }
                }
            });
        }

        function selectRole(roleId) {
            currentSelectedRoleId = roleId;
            
            // Toggle active button style
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            if (roleId === 1) document.getElementById('roleBtnAdmin').classList.add('active');
            else if (roleId === 2) document.getElementById('roleBtnEmployee').classList.add('active');
            else if (roleId === 3) document.getElementById('roleBtnCustomer').classList.add('active');

            loadRolePermissionsIntoCheckboxes(roleId);
        }

        async function savePermissions() {
            if (currentSelectedRoleId === 1) {
                Swal.fire('คำแนะนำ', 'บัญชีระดับ Admin มีสิทธิ์ทั้งหมดเป็นค่าเริ่มต้น ไม่สามารถลบหรือแก้ไขสิทธิ์ได้', 'info');
                return;
            }

            const checkedPerms = [];
            document.querySelectorAll('input[name="permission"]:checked').forEach(cb => {
                checkedPerms.push(cb.value);
            });

            try {
                const res = await fetch('/api/roles/permissions/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        role_id: currentSelectedRoleId,
                        permissions: checkedPerms
                    })
                });

                const result = await res.json();
                if (res.ok) {
                    Swal.fire('สำเร็จ', 'บันทึกการตั้งค่าสิทธิ์เรียบร้อยแล้ว', 'success').then(() => {
                        fetchRolePermissions();
                    });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', result.message || 'บันทึกข้อมูลไม่สำเร็จ', 'error');
                }
            } catch (err) {
                console.error("Save error:", err);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่ออินเทอร์เน็ตเพื่อบันทึกข้อมูลได้', 'error');
            }
        }

        function updateRoleUI() {
            // Placeholder callback
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

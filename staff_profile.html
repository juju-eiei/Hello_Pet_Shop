<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัวพนักงาน - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="/css/staff_mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Outfit', 'Kanit', sans-serif; background-color: #f8fafc; }
        
        #loading {
            background: #ffffff;
            border-radius: 12px;
            padding: 60px;
            text-align: center;
            max-width: 600px;
            margin: 40px auto;
            border: 1px solid #e2e8f0;
            color: #64748b;
        }

        .spinner-icon {
            font-size: 32px;
            color: #16a34a;
            margin-bottom: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile-container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            position: relative;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-banner-bg {
            display: none;
        }

        .profile-form-body {
            padding: 48px;
        }

        .profile-avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 10;
        }

        .avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            position: relative;
            transition: all 0.2s ease;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-circle::after {
            content: '\f030'; /* camera icon */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .avatar-circle.editable-avatar::after {
            opacity: 1;
        }

        .avatar-circle.editable-avatar:hover::after {
            background: rgba(15, 23, 42, 0.75);
        }

        .profile-name {
            font-size: 22px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .profile-role-badge {
            background-color: #f1f5f9;
            color: #475569;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .profile-role-badge i {
            font-size: 10px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
            margin-bottom: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
        }

        .section-title i {
            display: none;
        }

        .section-title::before {
            display: none;
        }

        .info-field {
            margin-bottom: 20px;
        }

        .info-label {
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 6px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            display: none;
        }

        .info-value {
            width: 100%;
            padding: 10px 14px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #0f172a;
            box-sizing: border-box;
            min-height: 40px;
            transition: all 0.2s ease;
        }

        .info-value:focus {
            background-color: #ffffff;
            border-color: #16a34a;
            color: #0f172a;
            outline: none;
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.08);
        }

        .form-actions {
            margin-top: 32px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-save {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: var(--secondary-berry-hover);
            color: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-save:hover {
            background: #433d30;
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-save:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Responsive overrides */
        @media (max-width: 768px) {
            .profile-container {
                margin: 20px auto 100px auto;
                border-radius: 0;
                border-left: none;
                border-right: none;
            }
            .profile-form-body {
                padding: 32px 16px;
            }
            .avatar-circle {
                width: 90px;
                height: 90px;
            }
        }
    </style>

    <!-- Mobile User-Agent Check -->
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
<script type="module" src="/src/js/main.js"></script>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-header"></header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="loading">
                <i class="fas fa-spinner spinner-icon"></i>
                <div style="font-weight: 500; font-size: 16px;">กำลังโหลดข้อมูลบุคลากร...</div>
            </div>

            <div id="contentBlock" style="display: none;">
                <div class="profile-container">
                    <div class="profile-banner-bg"></div>
                    <div class="profile-form-body">
                        <div class="profile-avatar-section">
                            <div class="avatar-circle" id="avatarContainer" onclick="document.getElementById('avatarUpload').click();" style="cursor: pointer;">
                                <i class="far fa-user"></i>
                            </div>
                            <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="handleAvatarChange(event)">
                            <div class="profile-name" id="sName">Sophia Bennett</div>
                            <div class="profile-role-badge" id="sRoleBadge"><i class="fas fa-shield-alt"></i> Staff</div>
                        </div>

                        <div class="section-title"><i class="fas fa-id-card"></i> ข้อมูลส่วนตัว (Personal Information)</div>
                        
                        <form id="staffProfileForm">
                            <div class="info-field">
                                <label class="info-label">Name</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-user"></i>
                                    <input type="text" class="info-value" id="edit_first_name" name="first_name" required>
                                </div>
                            </div>
                            <div class="info-field">
                                <label class="info-label">Address</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <input type="text" class="info-value" id="edit_address" name="address">
                                </div>
                            </div>

                            <div class="info-field">
                                <label class="info-label">Phone Number</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-phone"></i>
                                    <input type="text" class="info-value" id="edit_phone" name="phone">
                                </div>
                            </div>

                            <div class="info-field">
                                <label class="info-label">Email</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-envelope"></i>
                                    <input type="email" class="info-value" id="edit_email" name="email" required>
                                </div>
                            </div>

                            <div class="info-field">
                                <label class="info-label">Employee Type (ประเภทพนักงาน / สิทธิ์การจ้าง)</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-user-tag"></i>
                                    <input type="text" class="info-value" id="edit_employee_type" name="employee_type" readonly disabled style="background-color: #f1f5f9; border-color: #e2e8f0; cursor: not-allowed; color: #475569; font-weight: 600;">
                                </div>
                            </div>

                            <!-- Hidden fields to keep other data intact like last_name -->
                            <input type="hidden" id="edit_last_name" name="last_name">

                            <div class="form-actions" style="display: flex; gap: 12px; justify-content: flex-end;">
                                <button type="button" class="btn-save" id="editProfileBtn" style="background: var(--secondary-berry-hover);">
                                    <i class="fas fa-edit"></i> แก้ไขข้อมูล
                                </button>
                                <button type="button" class="btn-save" id="cancelEditBtn" style="background: var(--secondary-berry-light); color: var(--secondary-berry-hover); border: 1px solid var(--secondary-berry-border); display: none;">
                                    <i class="fas fa-times"></i> ยกเลิก
                                </button>
                                <button type="button" class="btn-save" id="saveProfileBtn" style="display: none;">
                                    <i class="fas fa-save"></i> บันทึกข้อมูล
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation for Mobile -->
        <nav class="bottom-nav">
            <a href="staff_stock.html" class="nav-item">
                <i class="fas fa-box"></i>
                <span data-i18n="nav.stock">จัดการคลังสินค้า</span>
            </a>
            <a href="staff_customers.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span data-i18n="nav.customers">ลูกค้า</span>
            </a>
            <a href="staff_orders.html" class="nav-item">
                <i class="fas fa-file-invoice"></i>
                <span data-i18n="nav.orders">คำสั่งซื้อ</span>
            </a>
            <a href="staff_profile.html" class="nav-item active">
                <i class="fas fa-user"></i>
                <span data-i18n="nav.profile">โปรไฟล์</span>
            </a>
        </nav>

    <!-- Scripts -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function toggleSubmenu(el) {
            const group = el.closest('.menu-group');
            group.classList.toggle('open');
            localStorage.setItem('staffProductsMenuOpen', group.classList.contains('open'));
        }

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            const role = user ? (user.role_name || '').toLowerCase() : '';
            if (!user || role === 'customer') {
                window.location.href = '/login.html';
                return null;
            }
            return user;
        }

        let currentStaffData = null;

        async function loadProfile(user) {
            try {
                // Fetch using logged-in user profile
                const res = await fetch(`/api/staff/me?user_id=${user.user_id}`);
                const json = await res.json();

                if (res.ok) {
                    currentStaffData = json.data;
                    renderProfile(json.data);
                } else {
                    document.getElementById('loading').innerHTML = `<span style="color: red;">Error: ${json.message}</span>`;
                }
            } catch (err) {
                document.getElementById('loading').innerHTML = '<span style="color: red;">Connection error.</span>';
            }
        }

        function formatPhone(phone) {
            if (!phone) return '-';
            if (phone.length === 10) {
                return phone.substring(0, 3) + '*******';
            }
            return phone;
        }

        let isEditing = false;
        let originalAvatarHTML = '';
        let temporaryAvatarBase64 = null;

        function setFieldsEditable(editable) {
            isEditing = editable;
            const fields = ['edit_first_name', 'edit_address', 'edit_phone', 'edit_email'];
            fields.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.disabled = !editable;
                    if (editable) {
                        el.style.backgroundColor = '#ffffff';
                        el.style.borderColor = '#cbd5e1';
                        el.style.cursor = 'text';
                    } else {
                        el.style.backgroundColor = '#f1f5f9';
                        el.style.borderColor = '#e2e8f0';
                        el.style.cursor = 'not-allowed';
                    }
                }
            });

            // Ensure employee type field remains strictly disabled and non-editable
            const typeEl = document.getElementById('edit_employee_type');
            if (typeEl) {
                typeEl.disabled = true;
                typeEl.readOnly = true;
                typeEl.style.backgroundColor = '#f1f5f9';
                typeEl.style.borderColor = '#e2e8f0';
                typeEl.style.cursor = 'not-allowed';
                typeEl.style.color = '#475569';
            }

            // Handle avatar clickability
            const avatarContainer = document.getElementById('avatarContainer');
            if (avatarContainer) {
                avatarContainer.style.pointerEvents = editable ? 'auto' : 'none';
                avatarContainer.style.cursor = editable ? 'pointer' : 'default';
                if (editable) {
                    avatarContainer.classList.add('editable-avatar');
                } else {
                    avatarContainer.classList.remove('editable-avatar');
                }
            }

            // Toggle button displays
            const editBtn = document.getElementById('editProfileBtn');
            const cancelBtn = document.getElementById('cancelEditBtn');
            const saveBtn = document.getElementById('saveProfileBtn');

            if (editBtn) editBtn.style.display = editable ? 'none' : 'inline-flex';
            if (cancelBtn) cancelBtn.style.display = editable ? 'inline-flex' : 'none';
            if (saveBtn) saveBtn.style.display = editable ? 'inline-flex' : 'none';
        }

        function renderProfile(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('contentBlock').style.display = 'block';

            const fullName = `${data.first_name} ${data.last_name || ''}`.trim();
            document.getElementById('sName').textContent = fullName || 'Unknown Staff';
            
            // Format Employee Type label based on payment_frequency & position
            let empTypeLabel = 'พนักงานรายเดือน (Monthly)';
            if (data.payment_frequency === 'Daily') {
                empTypeLabel = 'พนักงานรายวัน / พาร์ทไทม์ (Daily)';
            }
            if (data.position && data.position.trim() !== '') {
                empTypeLabel = `${data.position} (${empTypeLabel})`;
            }

            const typeInput = document.getElementById('edit_employee_type');
            if (typeInput) {
                typeInput.value = empTypeLabel;
            }

            // Set role name badge if we have the role info
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.role_name) {
                const roleBadge = document.getElementById('sRoleBadge');
                if (roleBadge) {
                    roleBadge.innerHTML = `<i class="fas fa-shield-alt"></i> ${user.role_name.toUpperCase()} &bull; ${empTypeLabel}`;
                }
            }

            // Populate the inline form
            document.getElementById('edit_last_name').value = data.last_name || ''; // Keep hidden to preserve data structure
            
            document.getElementById('edit_first_name').value = data.first_name || '';
            document.getElementById('edit_address').value = data.address || '';
            document.getElementById('edit_phone').value = data.phone || '';
            document.getElementById('edit_email').value = data.email || '';

            // Load profile image from localStorage
            const avatarContainer = document.getElementById('avatarContainer');
            if (avatarContainer && user) {
                const userKey = user.user_id ? `userProfileData_${user.user_id}` : 'userProfileData';
                const userProfile = JSON.parse(localStorage.getItem(userKey) || '{}');
                if (userProfile.profileImage) {
                    avatarContainer.innerHTML = `<img src="${userProfile.profileImage}" alt="Avatar">`;
                } else {
                    avatarContainer.innerHTML = `<i class="far fa-user"></i>`;
                }
            }

            setFieldsEditable(false);
        }

        const menuGroup = document.querySelector('.menu-group');
        if (menuGroup) {
            const isOpen = localStorage.getItem('staffProductsMenuOpen');
            if (isOpen === 'true') menuGroup.classList.add('open');
            else if (isOpen === 'false') menuGroup.classList.remove('open');
        }

        const user = checkAuth();
        if (user) {
            loadProfile(user);
        }

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            });
        }

        function handleAvatarChange(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    temporaryAvatarBase64 = e.target.result;
                    const avatarContainer = document.getElementById('avatarContainer');
                    avatarContainer.innerHTML = `<img src="${temporaryAvatarBase64}" alt="Avatar">`;
                };
                reader.readAsDataURL(file);
            }
        }


        document.getElementById('editProfileBtn')?.addEventListener('click', () => {
            const avatarContainer = document.getElementById('avatarContainer');
            if (avatarContainer) {
                originalAvatarHTML = avatarContainer.innerHTML;
            }
            setFieldsEditable(true);
        });

        document.getElementById('cancelEditBtn')?.addEventListener('click', () => {
            temporaryAvatarBase64 = null;
            const avatarContainer = document.getElementById('avatarContainer');
            if (avatarContainer && originalAvatarHTML) {
                avatarContainer.innerHTML = originalAvatarHTML;
            }
            if (currentStaffData) {
                renderProfile(currentStaffData);
            } else {
                setFieldsEditable(false);
            }
        });

        document.getElementById('saveProfileBtn')?.addEventListener('click', async () => {
            const form = document.getElementById('staffProfileForm');
            if(!form.checkValidity()) { form.reportValidity(); return; }

            const payload = Object.assign({}, currentStaffData);
            payload.first_name = document.getElementById('edit_first_name').value;
            payload.last_name = document.getElementById('edit_last_name').value;
            payload.email = document.getElementById('edit_email').value;
            payload.phone = document.getElementById('edit_phone').value;
            payload.address = document.getElementById('edit_address').value;
            
            payload.id = currentStaffData.employee_id || currentStaffData.id;

            try {
                const btn = document.getElementById('saveProfileBtn');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังบันทึก...';
                btn.disabled = true;

                const res = await fetch(`/api/staff/update?id=${payload.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
                btn.disabled = false;

                if (res.ok) {
                    if (temporaryAvatarBase64) {
                        const userObj = JSON.parse(localStorage.getItem('user') || '{}');
                        const userKey = userObj.user_id ? `userProfileData_${userObj.user_id}` : 'userProfileData';
                        const userProfile = JSON.parse(localStorage.getItem(userKey) || '{}');
                        userProfile.profileImage = temporaryAvatarBase64;
                        localStorage.setItem(userKey, JSON.stringify(userProfile));
                        localStorage.setItem('userProfileData', JSON.stringify(userProfile));
                    }
                    temporaryAvatarBase64 = null;

                    Swal.fire({
                        title: 'สำเร็จ!',
                        text: 'อัปเดตข้อมูลส่วนตัวสำเร็จ',
                        icon: 'success',
                        confirmButtonText: 'ตกลง',
                        confirmButtonColor: '#4D7C68'
                    }).then(() => {
                        window.location.reload();
                    });
                } else {
                    const errorJson = await res.json();
                    Swal.fire({
                        title: 'เกิดข้อผิดพลาด',
                        text: errorJson.message || 'มีบางอย่างผิดพลาด',
                        icon: 'error',
                        confirmButtonText: 'ตกลง',
                        confirmButtonColor: '#e11d48'
                    });
                }
            } catch (err) {
                Swal.fire({
                    title: 'ข้อผิดพลาด',
                    text: 'เกิดข้อผิดพลาดในการเชื่อมต่อ',
                    icon: 'error',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: '#e11d48'
                });
                const btn = document.getElementById('saveProfileBtn');
                btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

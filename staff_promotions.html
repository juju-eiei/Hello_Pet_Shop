<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการโปรโมชั่น (พนักงาน) - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="/css/staff_mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Mobile User-Agent Check -->
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
<script type="module" src="/src/js/main.js"></script>
    <style>
        .premium-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            padding: 24px;
            transition: all 0.2s ease-in-out;
        }
        .premium-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .card-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rate-table {
            width: 100%;
            border-collapse: collapse;
        }
        .rate-table th {
            text-align: left;
            padding: 12px;
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid #e2e8f0;
        }
        .rate-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            color: #334155;
        }
        .rate-table tr:hover td {
            background-color: #f8fafc;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #94a3b8;
            text-align: center;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }
        .empty-state p {
            margin: 0;
            font-size: 14px;
        }
        .badge {
            background-color: #fef3c7;
            color: #d97706;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #fde68a;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Staff Promotions Mobile */
        @media (max-width: 768px) {
            .premium-card { padding: 14px 12px !important; border-radius: 16px !important; }
            .card-header h2 { font-size: 15px !important; }
            .empty-state { padding: 30px 16px !important; }
            .empty-state i { font-size: 36px !important; }
            .empty-state p { font-size: 13px !important; }
            
            .table-responsive {
                overflow-x: hidden !important;
                width: 100% !important;
            }
            .rate-table {
                table-layout: fixed !important;
                width: 100% !important;
                min-width: 0 !important;
            }
            .rate-table th, .rate-table td {
                padding: 10px 4px !important;
                font-size: 12px !important;
                vertical-align: middle !important;
                box-sizing: border-box !important;
            }
            .rate-table th:first-child, .rate-table td:first-child {
                width: 32% !important;
                white-space: nowrap !important;
            }
            .rate-table th:nth-child(2), .rate-table td:nth-child(2) {
                width: 50% !important;
                word-break: break-word !important;
            }
            .rate-table th:nth-child(3), .rate-table td:nth-child(3) {
                width: 18% !important;
                text-align: center !important;
                white-space: nowrap !important;
            }
            .badge {
                font-size: 11px !important;
                padding: 3px 6px !important;
                white-space: normal !important;
                word-break: break-word !important;
                display: inline-flex !important;
                align-items: center !important;
                gap: 4px !important;
                line-height: 1.3 !important;
                max-width: 100% !important;
            }
        }
    </style>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-header"></header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content" style="background:#ffffff; height: 100%; overflow-y: auto; padding-bottom: 80px;">
            <div style="max-width: 1000px; margin: 0 auto; padding: 24px;">
                <div class="page-header">
                    <h1>โปรโมชั่น</h1>
                    <p style="color: #64748b; margin-top: 6px;">รายการของแถมตามระดับยอดซื้อสินค้า</p>
                </div>

                <div class="premium-card" style="margin-top: 20px;">
                    <div class="card-header">
                        <h2><i class="fas fa-gift" style="color: #ef4444;"></i> รายการของแถมตามระดับยอดซื้อ</h2>
                    </div>
                    <div id="giftsContainer">
                        <div class="loading-container">
                            <div class="spinner-loader"></div>
                            <span>กำลังโหลดข้อมูล...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Bottom Navigation for Mobile -->
        <nav class="bottom-nav">
            <a href="staff_orders.html" class="nav-item">
                <i class="fas fa-file-invoice"></i>
                <span>คำสั่งซื้อ</span>
            </a>
            <a href="staff_stock.html" class="nav-item">
                <i class="fas fa-warehouse"></i>
                <span>คลังสินค้า</span>
            </a>
            <a href="staff_promotions.html" class="nav-item active">
                <i class="fas fa-gift"></i>
                <span>โปรโมชั่น</span>
            </a>
            <a href="staff_customers.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>ลูกค้า</span>
            </a>
            <a href="staff_profile.html" class="nav-item">
                <i class="fas fa-user-cog"></i>
                <span>โปรไฟล์</span>
            </a>
        </nav>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.getElementById('sidebarOverlay'); if (sidebar && overlay) { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); } }

        function toggleSubmenu(el) {
            const group = el.closest('.menu-group');
            group.classList.toggle('open');
            localStorage.setItem('staffProductsMenuOpen', group.classList.contains('open'));
        }

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            const role = user ? (user.role_name || '').toLowerCase() : '';
            if (!user || role === 'customer') {
                window.location.href = '/login.html';
                return null;
            }
            return user;
        }

        async function fetchGiftRules() {
            const container = document.getElementById('giftsContainer');
            try {
                const response = await fetch('/api/rewards/gifts');
                const result = await response.json();
                if (response.ok) {
                    renderGiftRules(result.data || []);
                } else {
                    if (response.status === 401) {
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    if (response.status === 403) {
                        container.innerHTML = `<div style="padding: 30px; text-align: center; color: #ef4444;">คุณไม่มีสิทธิ์เข้าถึงข้อมูลโปรโมชั่นนี้</div>`;
                        return;
                    }
                    container.innerHTML = `<div style="padding: 30px; text-align: center; color: #ef4444;">${result.message || "เกิดข้อผิดพลาดในการโหลดข้อมูล"}</div>`;
                }
            } catch (error) {
                console.error("fetchGiftRules error:", error);
                container.innerHTML = `<div style="padding: 30px; text-align: center; color: #ef4444;">เกิดข้อผิดพลาดในการเชื่อมต่อ</div>`;
            }
        }

        function renderGiftRules(rules) {
            const container = document.getElementById('giftsContainer');
            if (rules.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-gift" style="font-size: 36px; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <p style="margin: 0; font-size: 14px;">ยังไม่มีโปรโมชั่นของแถมในระบบ</p>
                    </div>`;
                return;
            }

            let html = `
                <div class="table-responsive">
                <table class="rate-table">
                    <thead>
                        <tr>
                            <th>ยอดซื้อขั้นต่ำ (บาท)</th>
                            <th>ของแถมที่ได้รับ</th>
                            <th style="text-align: center;">จำนวน (ชิ้น)</th>
                        </tr>
                    </thead>
                    <tbody>`;

            rules.forEach(rule => {
                html += `
                    <tr>
                        <td><strong>฿${parseFloat(rule.min_spend).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</strong></td>
                        <td><span class="badge"><i class="fas fa-gift"></i> ${rule.gift_name}</span></td>
                        <td style="text-align: center;"><strong>${rule.gift_qty}</strong></td>
                    </tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        const menuGroup = document.querySelector('.menu-group');
        if (menuGroup) {
            const isOpen = localStorage.getItem('staffProductsMenuOpen');
            if (isOpen === 'true') menuGroup.classList.add('open');
            else if (isOpen === 'false') menuGroup.classList.remove('open');
        }

        const user = checkAuth();
        if (user) {
            fetchGiftRules();
        }

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            });
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.className = 'toast', 3000);
        }
    </script>
</body>
</html>

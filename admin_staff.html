<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการพนักงาน - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Calendar Styles */
        .calendar-header-day {
            text-align: center; font-weight: 600; font-size: 12px; color: #94a3b8; padding: 4px 0;
        }
        .calendar-day {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 8px; cursor: pointer; transition: background 0.2s, color 0.2s; border: 1px solid #f1f5f9; background: #fff; color: #334155;
        }
        .calendar-day:hover:not(.empty) {
            background: #f0fdf4;
            color: var(--primary-green);
        }
        .calendar-day.checked-in {
            background: var(--primary-green); color: #fff; font-weight: bold; border-color: var(--primary-green);
        }
        .calendar-day.empty {
            border: none; background: transparent; cursor: default;
        }

        /* Premium Modal / Drawer Styles */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            align-items: center;
            justify-content: center;
        }
        .drawer-overlay.show {
            display: flex;
            opacity: 1;
        }
        
        .drawer {
            position: relative;
            width: 100%;
            max-width: 680px;
            max-height: 85vh;
            background: white;
            z-index: 2001;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(30px);
            opacity: 0;
        }
        .drawer.open {
            transform: translateY(0);
            opacity: 1;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px 10px 40px;
        }

        /* Custom Scrollbar for Drawer Body */
        .drawer-body::-webkit-scrollbar {
            width: 8px;
        }
        .drawer-body::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }
        .drawer-body::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .drawer-body::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .drawer-header {
            background: linear-gradient(135deg, var(--primary-green) 0%, #476a3d 100%);
            color: white !important;
            padding: 24px 40px;
            margin: 0;
            border-radius: 24px 24px 0 0;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(49, 77, 42, 0.15);
            font-family: 'Outfit', 'Kanit', sans-serif;
            border: none;
            flex-shrink: 0;
        }

        .form-section-card {
            background: #fbfdfb;
            border: 1px solid rgba(148, 173, 94, 0.2);
            border-left: 4px solid var(--primary-green);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.01);
            transition: all 0.3s ease;
        }
        .form-section-card:hover {
            box-shadow: 0 4px 15px rgba(49, 77, 42, 0.06);
            border-color: rgba(148, 173, 94, 0.4);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Grid form group layouts */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 24px;
        }
        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .drawer {
                padding: 0;
                max-height: 90vh;
                width: 95%;
            }
            .form-section-card {
                padding: 16px;
                margin-bottom: 16px;
            }
            .drawer-header {
                padding: 20px 24px;
                margin: 0;
                border-radius: 12px 12px 0 0;
            }
            .drawer-body {
                padding: 20px 20px 10px 20px;
            }
            .drawer-footer {
                padding: 16px 20px;
                border-radius: 0 0 12px 12px;
            }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d8e2dc;
            border-radius: 12px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            background: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-green);
            background: white;
            box-shadow: 0 0 0 4px rgba(49, 77, 42, 0.08);
        }

        .drawer-footer {
            padding: 20px 40px;
            background: #f8fafc;
            border-top: 1.5px solid #f1f5f9;
            border-radius: 0 0 24px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            flex-shrink: 0;
        }
        .btn-cancel {
            padding: 12px 28px;
            border-radius: 12px;
            border: 1px solid #fee2e2;
            background: #fff5f5;
            color: #ef4444;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s;
        }
        .btn-cancel:hover {
            background: #fee2e2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.1);
        }
        .btn-save {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            background: var(--primary-green);
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(49, 77, 42, 0.2);
        }
        .btn-save:hover {
            background: #1a2a18;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(49, 77, 42, 0.3);
        }

        .staff-name {
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
        }

        .attendance-link {
            color: #2563eb;
            background: #eff6ff;
            border: 1px solid #dbeafe;
        }
        .attendance-link:hover {
            background: #2563eb;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
        .btn-attendance {
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-attendance:hover {
            background-color: #dbeafe;
            transform: translateY(-1px);
        }
    </style>

    <!-- Mobile User-Agent Check -->
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
    <script type="module" src="/src/js/main.js"></script>
</head>

            <form id="staffForm" style="display: flex; flex-direction: column; overflow: hidden; flex: 1;">

                <span id="attendanceHeaderTitle" data-i18n="title.attendance">Attendance Calendar</span>

    <div id="toast" class="toast"></div>

    <script>
        let currentKeyword = '';
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentStaff = [];
        let rolesList = [];
        let activeTab = 'info';

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role_name.toLowerCase() !== 'admin') {
                window.location.href = 'login.html';
            }
        }

        async function init() {
            checkAuth();
            await fetchRoles();
            await fetchStaff();
            renderHeaders();
        }

        async function fetchRoles() {
            try {
                const res = await fetch('/api/staff/roles');
                const result = await res.json();
                if (res.ok) {
                    rolesList = result.data;
                    const select = document.getElementById('role_id');
                    select.innerHTML = rolesList.map(r => `<option value="${r.role_id}">${r.role_name}</option>`).join('');
                }
            } catch (error) { console.error("Error fetching roles", error); }
        }

        async function fetchStaff() {
            try {
                const response = await fetch(`/api/staff?keyword=${encodeURIComponent(currentKeyword)}`);
                const result = await response.json();
                if (response.ok) {
                    currentStaff = result.data || [];
                    renderStaff();
                } else {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    showToast(result.message || "เกิดข้อผิดพลาดในการดึงข้อมูล", "error");
                }
            } catch (error) {
                console.error("fetchStaff error:", error);
                showToast("เกิดข้อผิดพลาดในการดึงข้อมูล", "error");
            }
        }

        function renderHeaders() {
            const header = document.getElementById('tableHeader');
            const getT = (key, defaultVal) => window.i18n ? window.i18n.t(key, defaultVal) : defaultVal;
            
            if (activeTab === 'info') {
                header.innerHTML = `<span style="flex: 2;">${getT('label.name', 'Name')}</span><span style="flex: 2;">${getT('label.role', 'Role')}</span><span style="flex: 2;">${getT('label.contact', 'Contact Information')}</span><span style="flex: 1; text-align: right;">${getT('label.action', 'Actions')}</span>`;
            } else if (activeTab === 'salary') {
                header.innerHTML = `<span style="flex: 2;">${getT('label.name', 'Name')}</span><span style="flex: 1;">${getT('label.base_salary', 'Base Salary')}</span><span style="flex: 1;">${getT('label.payment_frequency', 'Frequency')}</span><span style="flex: 2;">${getT('label.bank_account_details', 'Bank Account')}</span><span style="flex: 1; text-align: right;">${getT('label.action', 'Actions')}</span>`;
            } else {
                header.innerHTML = `<span style="flex: 2;">${getT('label.name', 'Name')}</span><span style="flex: 1;">${getT('label.role', 'Role')}</span><span style="flex: 2;">${getT('label.attendance_days', 'Days Worked')}</span><span style="flex: 1; text-align: right;">${getT('label.action', 'Actions')}</span>`;
            }
            renderStaff();
        }

        function renderStaff() {
            const container = document.getElementById('staffContainer');
            const paginationContainer = document.getElementById('paginationContainer');
            const getT = (key, defaultVal) => window.i18n ? window.i18n.t(key, defaultVal) : defaultVal;
            if (currentStaff.length === 0) {
                container.innerHTML = '<div style="padding: 50px; text-align: center; color: #718096;">ไม่พบพนักงาน</div>';
                if (paginationContainer) paginationContainer.innerHTML = '';
                return;
            }

            // Pagination boundaries check
            const totalPages = Math.ceil(currentStaff.length / itemsPerPage);
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }
            if (currentPage < 1) {
                currentPage = 1;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedStaff = currentStaff.slice(startIndex, endIndex);

            container.innerHTML = paginatedStaff.map(s => {
                const name = `${s.first_name} ${s.last_name}`;
                let rowHtml = `<div class="product-row">`;
                
                rowHtml += `<div class="staff-name" style="flex: 2;">${name}</div>`;

                if (activeTab === 'info') {
                    rowHtml += `<div style="flex: 2; color: #64748b;">${s.role_name || 'N/A'}</div>`;
                    rowHtml += `<div style="flex: 2; color: #3b82f6;">${s.email}</div>`;
                } else if (activeTab === 'salary') {
                    rowHtml += `<div style="flex: 1; color: #64748b;">฿${parseFloat(s.base_salary || 0).toLocaleString()}</div>`;
                    const freqKey = s.payment_frequency ? 'label.' + s.payment_frequency.toLowerCase().replace('-', '_') : '';
                    let freqText = freqKey && window.i18n ? window.i18n.t(freqKey, s.payment_frequency) : (s.payment_frequency || '-');
                    if (s.payment_frequency === 'Daily' || s.payment_frequency === 'Weekly') {
                        freqText += ` (${s.days_worked || 0} ${getT('label.days', 'วัน')})`;
                    }
                    rowHtml += `<div style="flex: 1; color: #64748b;">${freqText}</div>`;
                    rowHtml += `<div style="flex: 2; color: #64748b;">${s.bank_account_details || '-'}</div>`;
                } else {
                    rowHtml += `<div style="flex: 1; color: #64748b;">${s.role_name || 'N/A'}</div>`;
                    const daysVal = (s.payment_frequency === 'Daily' || s.payment_frequency === 'Weekly') ? `${s.days_worked || 0} ${getT('label.days', 'days')}` : '-';
                    rowHtml += `<div style="flex: 2; color: #64748b;">${daysVal}</div>`;
                }

                const showCalendar = activeTab === 'salary';
                const calendarBtn = showCalendar ? `<button type="button" onclick="openAttendanceModal(${s.employee_id})" class="action-link attendance-link" title="Attendance"><i class="far fa-calendar-check"></i></button>` : '';

                rowHtml += `<div style="flex: 1; justify-content: flex-end; display: flex; gap: 8px;">
                    ${calendarBtn}
                    <button type="button" onclick="editStaff(${s.employee_id})" class="action-link edit-link" title="Edit">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button type="button" onclick="deleteStaff(${s.employee_id})" class="action-link delete-link" title="Delete">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div></div>`;
                return rowHtml;
            }).join('');

            renderPagination(currentStaff.length);
        }

        function renderPagination(totalItems) {
            const paginationContainer = document.getElementById('paginationContainer');
            if (!paginationContainer) return;

            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = '';
            
            // Previous button
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.changePage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = startPage + maxVisiblePages - 1;

            if (endPage > totalPages) {
                endPage = totalPages;
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="window.changePage(${i})">${i}</button>`;
            }

            // Next button
            html += `<button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="window.changePage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;

            paginationContainer.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderStaff();
        }

        window.changePage = changePage;


        // Drawer logic
        const drawer = document.getElementById('staffDrawer');
        const overlay = document.getElementById('drawerOverlay');
        const dHeader = document.getElementById('drawerHeader');
        
        document.getElementById('addStaffBtn').addEventListener('click', () => {
            document.getElementById('staffForm').reset();
            document.getElementById('employee_id').value = '';
            document.getElementById('password').setAttribute('required', 'true');
            const attSection = document.getElementById('editModalAttendanceSection');
            if (attSection) attSection.style.display = 'none';
            openDrawer("ส่วนงานจัดการพนักงาน - Add New Staff");
        });

        function editStaff(id) {
            const s = currentStaff.find(x => x.employee_id == id);
            if (!s) return;
            document.getElementById('staffForm').reset();
            document.getElementById('employee_id').value = s.employee_id;
            document.getElementById('first_name').value = s.first_name;
            document.getElementById('last_name').value = s.last_name;
            document.getElementById('username').value = s.username || '';
            document.getElementById('email').value = s.email;
            document.getElementById('password').removeAttribute('required'); // Optional on edit
            document.getElementById('phone').value = s.phone || '';
            document.getElementById('address').value = s.address || '';
            document.getElementById('base_salary').value = parseFloat(s.base_salary || 0);
            document.getElementById('payment_frequency').value = s.payment_frequency || 'Monthly';
            document.getElementById('bank_account_details').value = s.bank_account_details || '';
            document.getElementById('role_id').value = s.role_id;

            const attSection = document.getElementById('editModalAttendanceSection');
            if (attSection) {
                attSection.style.display = 'block';
            }

            openDrawer("ส่วนงานจัดการพนักงาน - Edit Staff");
        }

        function openDrawer(titleCode) {
            const drawer = document.getElementById('staffDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const dHeader = document.getElementById('drawerHeader');
            if (drawer && overlay && dHeader) {
                dHeader.innerHTML = `<i class="fas fa-user-cog" style="margin-right: 12px; font-size: 22px;"></i><span>${titleCode}</span>`;
                overlay.classList.add('show');
                setTimeout(() => {
                    drawer.classList.add('open');
                }, 10);
            }
        }

        function closeDrawer() {
            const drawer = document.getElementById('staffDrawer');
            const overlay = document.getElementById('drawerOverlay');
            if (drawer && overlay) {
                drawer.classList.remove('open');
                setTimeout(() => {
                    overlay.classList.remove('show');
                }, 300);
            }
        }
        document.addEventListener('click', (e) => {
            const overlay = document.getElementById('drawerOverlay');
            if (overlay && e.target === overlay) closeDrawer();
        });

        document.getElementById('payment_frequency').addEventListener('change', (e) => {
            const attSection = document.getElementById('editModalAttendanceSection');
            if (attSection) {
                const employeeId = document.getElementById('employee_id').value;
                if (employeeId) {
                    attSection.style.display = 'block';
                } else {
                    attSection.style.display = 'none';
                }
            }
        });

        // Form Submit
        document.getElementById('saveStaffBtn').addEventListener('click', async () => {
            const form = document.getElementById('staffForm');
            console.log("saveStaffBtn clicked. Form validity:", form.checkValidity());
            if(!form.checkValidity()) {
                const invalidFields = Array.from(form.querySelectorAll(':invalid')).map(el => ({ name: el.name, id: el.id, value: el.value }));
                console.warn("Form validation failed. Invalid fields: " + JSON.stringify(invalidFields));
                form.reportValidity();
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            const isUpdate = !!data.id;
            const url = isUpdate ? `/api/staff/update?id=${data.id}` : `/api/staff/create`;

            console.log("saveStaffBtn start: " + JSON.stringify({ url, data }));

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                console.log("saveStaffBtn response status:", response.status);
                
                if (response.ok) {
                    console.log("saveStaffBtn success!");
                    showToast(isUpdate ? "อัปเดตพนักงานสำเร็จ" : "เพิ่มพนักงานสำเร็จ", "success");
                    closeDrawer();
                    fetchStaff();
                } else {
                    const res = await response.json();
                    console.error("saveStaffBtn failed:", res);
                    showToast(res.message || "เกิดข้อผิดพลาด", "error");
                }
            } catch (error) { 
                console.error("saveStaffBtn error:", error);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error"); 
            }
        });

        async function deleteStaff(id) {
            if(!confirm("ยืนยันการลบพนักงาน?")) return;
            try {
                const response = await fetch(`/api/staff/delete?id=${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast("ลบพนักงานสำเร็จ", "success");
                    fetchStaff();
                }
            } catch (error) { showToast("เกิดข้อผิดพลาด", "error"); }
        }

        // Attendance Calendar Logic
        let currentEmployeeIdForAttendance = null;
        let currentEmployeeNameForAttendance = '';
        let currentEmployeeFrequencyForAttendance = 'Monthly';
        let attendanceCurrentMonthDate = new Date();
        let checkedInDates = [];

        function openAttendanceModal(employeeId, employeeName) {
            try {
                console.log("openAttendanceModal called with:", { employeeId, employeeName });
                const s = currentStaff.find(x => x.employee_id == employeeId);
                if (!employeeName) {
                    employeeName = s ? `${s.first_name} ${s.last_name}` : '';
                }
                currentEmployeeIdForAttendance = employeeId;
                currentEmployeeNameForAttendance = employeeName;
                currentEmployeeFrequencyForAttendance = s && s.payment_frequency ? s.payment_frequency : 'Monthly';
                currentEmployeeNameForAttendance = employeeName;
                attendanceCurrentMonthDate = new Date();
                
                const overlay = document.getElementById('attendanceOverlay');
                const drawer = document.getElementById('attendanceDrawer');
                
                if (overlay && drawer) {
                    overlay.classList.add('show');
                    setTimeout(() => {
                        drawer.classList.add('open');
                    }, 10);
                    
                    fetchAndRenderCalendar();
                } else {
                    console.error("Attendance modal overlay or drawer elements not found in DOM!", { overlay, drawer });
                    showToast("ไม่พบองค์ประกอบประวัติเวลาทำงานในหน้านี้", "error");
                }
            } catch (err) {
                console.error("Exception in openAttendanceModal:", err);
                showToast("เกิดข้อผิดพลาดในการเปิดระบบเวลาทำงาน: " + err.message, "error");
            }
        }

        function closeAttendanceModal() {
            const overlay = document.getElementById('attendanceOverlay');
            const drawer = document.getElementById('attendanceDrawer');
            if (overlay && drawer) {
                drawer.classList.remove('open');
                setTimeout(() => {
                    overlay.classList.remove('show');
                }, 300);
            }
        }

        function changeAttendanceMonth(direction) {
            if (currentEmployeeFrequencyForAttendance === 'Monthly') {
                attendanceCurrentMonthDate.setFullYear(attendanceCurrentMonthDate.getFullYear() + direction);
            } else {
                attendanceCurrentMonthDate.setMonth(attendanceCurrentMonthDate.getMonth() + direction);
            }
            fetchAndRenderCalendar();
        }

        async function fetchAndRenderCalendar() {
            if (!currentEmployeeIdForAttendance) return;

            const year = attendanceCurrentMonthDate.getFullYear();
            let monthStr = '';
            
            if (currentEmployeeFrequencyForAttendance === 'Monthly') {
                monthStr = `${year}`;
            } else {
                const month = String(attendanceCurrentMonthDate.getMonth() + 1).padStart(2, '0');
                monthStr = `${year}-${month}`;
            }

            // Fetch checked in dates
            try {
                const response = await fetch(`/api/attendance?employee_id=${currentEmployeeIdForAttendance}&month=${monthStr}`);
                const result = await response.json();
                if (response.ok) {
                    checkedInDates = result.data.dates || [];
                } else {
                    checkedInDates = [];
                    console.error("Error fetching attendance logs:", result.message);
                }
            } catch (err) {
                checkedInDates = [];
                console.error("Connection error fetching attendance logs:", err);
            }

            renderCalendarGrid();
        }

        function renderCalendarGrid() {
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('attendanceMonthLabel');
            
            // Format month year label depending on current language
            const lang = window.i18n ? window.i18n.getLanguage() : 'th';
            const options = { month: 'long', year: 'numeric' };
            const locale = lang === 'th' ? 'th-TH' : 'en-US';
            label.textContent = attendanceCurrentMonthDate.toLocaleDateString(locale, options);

            const freq = currentEmployeeFrequencyForAttendance;
            if (freq === 'Monthly') {
                const yearOptions = { year: 'numeric' };
                label.textContent = attendanceCurrentMonthDate.toLocaleDateString(locale, yearOptions);

                grid.style.display = 'grid';
                grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
                grid.style.gap = '12px';
                grid.style.padding = '0';
                grid.innerHTML = '';

                const monthNames = lang === 'th'
                    ? ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.']
                    : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

                const year = attendanceCurrentMonthDate.getFullYear();

                for (let m = 0; m < 12; m++) {
                    const monthPrefix = `${year}-${String(m + 1).padStart(2, '0')}`;
                    const isMonthCheckedIn = checkedInDates.some(date => date.startsWith(monthPrefix));

                    const cell = document.createElement('div');
                    cell.className = `calendar-day${isMonthCheckedIn ? ' checked-in' : ''}`;
                    cell.style.aspectRatio = 'auto';
                    cell.style.padding = '12px 6px';
                    cell.style.display = 'flex';
                    cell.style.alignItems = 'center';
                    cell.style.justifyContent = 'center';
                    cell.style.fontWeight = '600';
                    cell.style.fontSize = '14px';
                    cell.style.borderRadius = '8px';
                    cell.style.cursor = 'pointer';
                    cell.style.transition = 'all 0.2s';
                    cell.textContent = monthNames[m];

                    const firstDayStr = `${monthPrefix}-01`;
                    cell.addEventListener('click', () => toggleAttendanceDate(firstDayStr, isMonthCheckedIn, m));
                    grid.appendChild(cell);
                }
                return;
            }

            // Restore defaults for Weekly/Daily
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = 'repeat(7, 1fr)';
            grid.style.gap = '8px';
            grid.style.padding = '0';

            grid.innerHTML = '';

            // Render day of week headers (Sun - Sat)
            const thHeaders = lang === 'th' 
                ? ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'] 
                : ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
                
            thHeaders.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-header-day';
                dayEl.textContent = day;
                grid.appendChild(dayEl);
            });

            const year = attendanceCurrentMonthDate.getFullYear();
            const month = attendanceCurrentMonthDate.getMonth();

            // First day of the month
            const firstDay = new Date(year, month, 1).getDay();
            // Total days in the month
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Render empty cells before the first day of the month
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                grid.appendChild(emptyCell);
            }

            // Render days of the month
            for (let day = 1; day <= totalDays; day++) {
                const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isCheckedIn = checkedInDates.includes(dayStr);
                
                const cell = document.createElement('div');
                cell.className = `calendar-day${isCheckedIn ? ' checked-in' : ''}`;
                cell.textContent = day;
                
                if (isCheckedIn) {
                    cell.title = `${currentEmployeeNameForAttendance} - Checked In`;
                }

                cell.addEventListener('click', () => toggleAttendanceDate(dayStr, isCheckedIn));
                grid.appendChild(cell);
            }
        }

        async function toggleAttendanceDate(dateStr, isCurrentlyCheckedIn, targetMonthIndex) {
            const url = isCurrentlyCheckedIn ? '/api/attendance/checkout' : '/api/attendance/checkin';
            
            // Calculate batch dates based on frequency
            let dates = [];
            const parts = dateStr.split('-');
            const year = parseInt(parts[0], 10);
            
            const freq = currentEmployeeFrequencyForAttendance;
            
            if (freq === 'Monthly') {
                const month = targetMonthIndex !== undefined ? targetMonthIndex : (parseInt(parts[1], 10) - 1);
                // Get all dates in this month
                const totalDays = new Date(year, month + 1, 0).getDate();
                for (let d = 1; d <= totalDays; d++) {
                    dates.push(`${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
                }
            } else if (freq === 'Weekly') {
                const month = parseInt(parts[1], 10) - 1; // 0-indexed
                const day = parseInt(parts[2], 10);
                // Get 7 consecutive days starting from clicked date
                for (let i = 0; i < 7; i++) {
                    const nextDate = new Date(year, month, day + i);
                    const y = nextDate.getFullYear();
                    const m = String(nextDate.getMonth() + 1).padStart(2, '0');
                    const d = String(nextDate.getDate()).padStart(2, '0');
                    dates.push(`${y}-${m}-${d}`);
                }
            } else {
                // Daily or others: just the single clicked date
                dates.push(dateStr);
            }

            console.log("toggleAttendanceDate start: " + JSON.stringify({ url, dates, freq, isCurrentlyCheckedIn }));

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employee_id: currentEmployeeIdForAttendance,
                        work_date: dates
                    })
                });
                
                console.log("toggleAttendanceDate HTTP response status:", response.status);
                
                if (response.ok) {
                    let successMsg = '';
                    if (isCurrentlyCheckedIn) {
                        successMsg = freq === 'Monthly' ? "ยกเลิกการจองตารางงานรายเดือนสำเร็จ" : (freq === 'Weekly' ? "ยกเลิกการจองตารางงานรายสัปดาห์สำเร็จ" : "บันทึกเอาวันทำงานออกสำเร็จ");
                    } else {
                        successMsg = freq === 'Monthly' ? "จองตารางงานรายเดือนสำเร็จ" : (freq === 'Weekly' ? "จองตารางงานรายสัปดาห์สำเร็จ" : "บันทึกวันทำงานสำเร็จ");
                    }
                    showToast(successMsg, "success");
                    fetchAndRenderCalendar();
                } else {
                    const result = await response.json();
                    console.error("toggleAttendanceDate failed with API response:", result);
                    showToast(result.message || "เกิดข้อผิดพลาด", "error");
                }
            } catch (err) {
                console.error("toggleAttendanceDate fetch error:", err);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

            try {
                const employeeIdEl = document.getElementById('employee_id');
                const firstNameEl = document.getElementById('first_name');
                const lastNameEl = document.getElementById('last_name');

                if (employeeId) {

                        openAttendanceModal(employeeId, name);

                    console.warn("openAttendanceFromEdit: employeeId value is empty!");

                }

                console.error("Exception in openAttendanceFromEdit:", err);
                showToast("เกิดข้อผิดพลาด: " + err.message, "error");
            }
        }

        // Tabs
        document.querySelectorAll('.filter-btn').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(t => t.classList.remove('active'));

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentKeyword = e.target.value;

        function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.getElementById('sidebarOverlay'); if (sidebar && overlay) { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); } }

        const hBtn = document.getElementById('hamburgerBtn'); if (hBtn) hBtn.addEventListener('click', toggleSidebar);
        const sOverlay = document.getElementById('sidebarOverlay'); if (sOverlay) sOverlay.addEventListener('click', toggleSidebar);

        function toggleSubmenu(el) {
            const group = el.closest('.menu-group');
            if (group) {
                group.classList.toggle('open');
                localStorage.setItem('productsMenuOpen', group.classList.contains('open'));
            }
        }

        // Restore submenu state
        document.addEventListener('DOMContentLoaded', () => {
            const menuGroup = document.querySelector('.menu-group');
            if (menuGroup) {
                const isOpen = localStorage.getItem('productsMenuOpen');
                if (isOpen === 'true') menuGroup.classList.add('open');
                else if (isOpen === 'false') menuGroup.classList.remove('open');
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        const lBtn = document.getElementById('logoutBtn'); if (lBtn) lBtn.addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('user'); window.location.href = 'login.html'; });

        init();
    </script>

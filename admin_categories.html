<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการหมวดหมู่สินค้า - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
    <script type="module" src="/src/js/main.js"></script>
    <style>
        @media (max-width: 768px) {
            .page-header {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 10px !important;
            }
            .page-header > div {
                width: 100% !important;
                display: flex !important;
                gap: 8px !important;
            }
            .page-header button {
                flex: 1 !important;
                justify-content: center !important;
                font-size: 13px !important;
                padding: 10px 14px !important;
            }
            .modal-card {
                width: 95% !important;
                padding: 20px 16px !important;
                border-radius: 16px !important;
            }
        }
    </style>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <header class="mobile-header"></header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h1>หมวดหมู่สินค้า</h1>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button id="deleteSelectedCategoriesBtn" style="padding: 10px 20px; font-size: 14px; background-color: #ef4444; border: 1px solid #ef4444; border-radius: 12px; font-weight: 600; color: white; display: none; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; outline: none; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); height: 42px; white-space: nowrap; width: auto; font-family: inherit;">
                        <i class="fas fa-trash-alt"></i>
                        <span>ลบรายการที่เลือก</span>
                    </button>
                    <button onclick="openAddCategoryModal()" class="save-btn" style="padding: 10px 24px; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; height: 42px;">
                        <i class="fas fa-plus" style="margin-right: 8px;"></i>
                        เพิ่มหมวดหมู่สินค้า
                    </button>
                </div>
            </div>

            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาหมวดหมู่สินค้า...">
            </div>

            <div class="stock-table">
                <div class="table-header" style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <input type="checkbox" id="selectAllCategoriesCheckbox" style="transform: scale(1.2); cursor: pointer;">
                    </div>
                    <span style="flex: 1;">รหัส</span>
                    <span style="flex: 3;">ชื่อหมวดหมู่</span>
                    <span style="flex: 2; text-align: center;">วันหมดอายุของล็อต</span>
                    <span style="flex: 1.2; text-align: right;">การจัดการ</span>
                </div>
                <div id="categoryContainer">
                    <div class="loading-container">
                        <div class="spinner-loader"></div>
                        <span>กำลังโหลดข้อมูล...</span>
                    </div>
                </div>
            </div>
            <!-- Pagination -->
            <div id="paginationContainer" class="pagination-container"></div>
        </main>


        <nav class="bottom-nav">
            <a href="admin_dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>แดชบอร์ด</span>
            </a>
            <a href="admin_orders.html" class="nav-item">
                <i class="fas fa-file-invoice"></i>
                <span>คำสั่งซื้อ</span>
            </a>
            <a href="admin_stock.html" class="nav-item active">
                <i class="fas fa-box"></i>
                <span>จัดการคลังสินค้า</span>
            </a>
            <a href="admin_customers.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>ลูกค้า</span>
            </a>
            <a href="admin_promotions.html" class="nav-item">
                <i class="fas fa-bullhorn"></i>
                <span>โปรโมชั่น</span>
            </a>
        </nav>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Confirm Delete Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="modalTitle">ยืนยันการลบ</div>
            <div class="modal-text" id="modalText">คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้?</div>
            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" id="cancelModalBtn">ยกเลิก</button>
                <button class="modal-btn modal-btn-confirm" id="confirmModalBtn">ลบประเภทสินค้า</button>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div id="addCategoryModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">เพิ่มประเภทสินค้าใหม่</div>
            <div class="form-group" style="margin-top: 15px; margin-bottom: 15px;">
                <label for="categoryName" style="display: block; margin-bottom: 8px; font-weight: 500;">Category Name <span style="color: red;">*</span></label>
                <input type="text" id="categoryName" class="form-control" placeholder="Enter category name" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;">
            </div>
            <div class="form-group" style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="categoryRequiresExpiration" style="width: 18px; height: 18px; cursor: pointer;" checked>
                <label for="categoryRequiresExpiration" style="font-weight: 500; cursor: pointer; user-select: none;">ต้องการใส่วันหมดอายุของล็อตสินค้า</label>
            </div>
            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" onclick="closeAddCategoryModal()">ยกเลิก</button>
                <button class="modal-btn" style="background-color: var(--secondary-berry); color: white;" onclick="addCategory()">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Edit Category Modal -->
    <div id="editCategoryModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">แก้ไขประเภทสินค้า</div>
            <input type="hidden" id="editCategoryId">
            <div class="form-group" style="margin-top: 15px; margin-bottom: 15px;">
                <label for="editCategoryName" style="display: block; margin-bottom: 8px; font-weight: 500;">ชื่อประเภทสินค้า <span style="color: red;">*</span></label>
                <input type="text" id="editCategoryName" class="form-control" placeholder="Enter category name" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;">
            </div>
            <div class="form-group" style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="editCategoryRequiresExpiration" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="editCategoryRequiresExpiration" style="font-weight: 500; cursor: pointer; user-select: none;">ต้องการใส่วันหมดอายุของล็อตสินค้า</label>
            </div>
            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" onclick="closeEditCategoryModal()">ยกเลิก</button>
                <button class="modal-btn" style="background-color: var(--secondary-berry); color: white;" onclick="updateCategory()">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        let allCategories = [];
        let currentKeyword = '';
        let currentPage = 1;
        const itemsPerPage = 20;

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role_name.toLowerCase() !== 'admin') {
                window.location.href = 'login.html';
            }
        }

        async function fetchCategories() {
            try {
                const response = await fetch('/api/categories');
                const result = await response.json();
                if (response.ok) {
                    allCategories = result.data || [];
                    renderCategories();
                } else {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    showToast(result.message || "เกิดข้อผิดพลาดในการดึงข้อมูล", "error");
                }
            } catch (error) {
                console.error("fetchCategories error:", error);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

        function updateDeleteSelectedCategoriesVisibility() {
            const deleteBtn = document.getElementById('deleteSelectedCategoriesBtn');
            if (!deleteBtn) return;
            const checkedCount = document.querySelectorAll('.category-select-checkbox:checked').length;
            if (checkedCount > 0) {
                deleteBtn.style.display = 'inline-flex';
            } else {
                deleteBtn.style.display = 'none';
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            const paginationContainer = document.getElementById('paginationContainer');
            
            const selectAllChk = document.getElementById('selectAllCategoriesCheckbox');
            if (selectAllChk) selectAllChk.checked = false;

            const filtered = allCategories.filter(c => 
                c.category_name.toLowerCase().includes(currentKeyword.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding: 50px; text-align: center; color: #718096;">ไม่พบประเภทสินค้า</div>';
                if (paginationContainer) paginationContainer.innerHTML = '';
                updateDeleteSelectedCategoriesVisibility();
                return;
            }

            // Pagination boundaries check
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }
            if (currentPage < 1) {
                currentPage = 1;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedCategories = filtered.slice(startIndex, endIndex);

            container.innerHTML = paginatedCategories.map(c => `
                <div class="product-row" style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <input type="checkbox" class="category-select-checkbox" data-category-id="${c.category_id}" style="transform: scale(1.2); cursor: pointer;" onclick="event.stopPropagation();">
                    </div>
                    <div style="flex: 1; color: #64748b;">#${c.category_id}</div>
                    <div class="product-details" style="flex: 3; margin-right: 20px;">
                        <div class="product-name">${c.category_name}</div>
                    </div>
                    <div style="flex: 2; text-align: center;">
                        <span class="status-badge" 
                              style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; 
                                     background-color: ${c.requires_expiration == 1 ? '#e6f4ea' : '#f1f5f9'}; 
                                     color: ${c.requires_expiration == 1 ? '#137333' : '#475569'};">
                            ${c.requires_expiration == 1 ? 'จำเป็น' : 'ไม่จำเป็น'}
                        </span>
                    </div>
                    <div class="stock-actions" style="flex: 1.2; text-align: right; justify-content: flex-end; display: flex; gap: 12px;">
                        <a href="#" onclick="openEditCategoryModal(${c.category_id}, '${c.category_name.replace(/'/g, "\\'")}', ${c.requires_expiration}); event.preventDefault();" class="action-link edit-link" title="Edit Category" style="color: #475569; margin-right: 8px;">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a href="#" onclick="deleteCategory(${c.category_id}, '${c.category_name.replace(/'/g, "\\'")}'); event.preventDefault();" class="action-link delete-link" title="Delete Category">
                            <i class="fas fa-trash-alt"></i>
                        </a>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.category-select-checkbox').forEach(cb => {
                cb.addEventListener('change', updateDeleteSelectedCategoriesVisibility);
            });
            updateDeleteSelectedCategoriesVisibility();

            renderPagination(filtered.length);
        }

        function renderPagination(totalItems) {
            const paginationContainer = document.getElementById('paginationContainer');
            if (!paginationContainer) return;

            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = '';
            
            // Previous button
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.changePage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = startPage + maxVisiblePages - 1;

            if (endPage > totalPages) {
                endPage = totalPages;
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="window.changePage(${i})">${i}</button>`;
            }

            // Next button
            html += `<button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="window.changePage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;

            paginationContainer.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderCategories();
        }

        window.changePage = changePage;


        function openAddCategoryModal() {
            document.getElementById('categoryName').value = '';
            if (document.getElementById('categoryRequiresExpiration')) {
                document.getElementById('categoryRequiresExpiration').checked = true;
            }
            document.getElementById('addCategoryModal').style.display = 'flex';
            setTimeout(() => document.getElementById('addCategoryModal').classList.add('show'), 10);
        }

        function closeAddCategoryModal() {
            const modal = document.getElementById('addCategoryModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function openEditCategoryModal(id, name, requiresExpiration) {
            document.getElementById('editCategoryId').value = id;
            document.getElementById('editCategoryName').value = name;
            document.getElementById('editCategoryRequiresExpiration').checked = requiresExpiration == 1;
            
            document.getElementById('editCategoryModal').style.display = 'flex';
            setTimeout(() => document.getElementById('editCategoryModal').classList.add('show'), 10);
        }

        function closeEditCategoryModal() {
            const modal = document.getElementById('editCategoryModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        async function updateCategory() {
            const id = document.getElementById('editCategoryId').value;
            const name = document.getElementById('editCategoryName').value.trim();
            if (!name) {
                showToast("กรุณากรอกชื่อประเภทสินค้า", "error");
                return;
            }
            const requiresExpiration = document.getElementById('editCategoryRequiresExpiration').checked ? 1 : 0;

            try {
                const response = await fetch('/api/categories/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, name: name, requires_expiration: requiresExpiration })
                });
                
                const result = await response.json();
                if (response.ok) {
                    showToast("แก้ไขประเภทสินค้าเรียบร้อย", "success");
                    closeEditCategoryModal();
                    fetchCategories();
                } else {
                    showToast(result.message || "เกิดข้อผิดพลาด", "error");
                }
            } catch (error) {
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

        async function addCategory() {
            const name = document.getElementById('categoryName').value.trim();
            if (!name) {
                showToast("กรุณากรอกชื่อประเภทสินค้า", "error");
                return;
            }
            const requiresExpiration = document.getElementById('categoryRequiresExpiration').checked ? 1 : 0;

            try {
                const response = await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, requires_expiration: requiresExpiration })
                });
                
                const result = await response.json();
                if (response.ok) {
                    showToast("เพิ่มประเภทสินค้าเรียบร้อย", "success");
                    closeAddCategoryModal();
                    fetchCategories();
                } else {
                    showToast(result.message || "เกิดข้อผิดพลาด", "error");
                }
            } catch (error) {
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

        async function deleteCategory(id, name) {
            const confirmed = await showConfirmModal("ยืนยันการลบ", `คุณต้องการลบประเภทสินค้า "${name}" ใช่หรือไม่?`);
            if (!confirmed) return;
            
            try {
                const response = await fetch('/api/categories/delete', { 
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                if (response.ok) {
                    showToast("ลบประเภทสินค้าเรียบร้อย", "success");
                    fetchCategories();
                } else {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    const res = await response.json();
                    showToast(res.message || "ลบไม่สำเร็จ", "error");
                }
            } catch (error) {
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

        function showConfirmModal(title, text) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                const titleEl = document.getElementById('modalTitle');
                const textEl = document.getElementById('modalText');
                const confirmBtn = document.getElementById('confirmModalBtn');
                const cancelBtn = document.getElementById('cancelModalBtn');

                titleEl.textContent = title;
                textEl.textContent = text;
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);

                const handleConfirm = () => { cleanup(); resolve(true); };
                const handleCancel = () => { cleanup(); resolve(false); };

                const cleanup = () => {
                    modal.classList.remove('show');
                    setTimeout(() => modal.style.display = 'none', 300);
                    confirmBtn.removeEventListener('click', handleConfirm);
                    cancelBtn.removeEventListener('click', handleCancel);
                };

                confirmBtn.addEventListener('click', handleConfirm);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentKeyword = e.target.value.trim();
            currentPage = 1;
            renderCategories();
        });

        const lBtn = document.getElementById('logoutBtn'); if (lBtn) lBtn.addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('user'); window.location.href = 'login.html'; });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.getElementById('sidebarOverlay'); if (sidebar && overlay) { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); } }

        const hBtn = document.getElementById('hamburgerBtn'); if (hBtn) hBtn.addEventListener('click', toggleSidebar);
        const sOverlay = document.getElementById('sidebarOverlay'); if (sOverlay) sOverlay.addEventListener('click', toggleSidebar);

        function toggleSubmenu(el) {
            const group = el.closest('.menu-group');
            if (group) {
                group.classList.toggle('open');
                localStorage.setItem('productsMenuOpen', group.classList.contains('open'));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const menuGroup = document.querySelector('.menu-group');
            if (menuGroup) {
                const isOpen = localStorage.getItem('productsMenuOpen');
                if (isOpen === 'true') menuGroup.classList.add('open');
                else if (isOpen === 'false') menuGroup.classList.remove('open');
            }
        });

        // Select All Handler
        const selectAllCategoriesChk = document.getElementById('selectAllCategoriesCheckbox');
        if (selectAllCategoriesChk) {
            selectAllCategoriesChk.addEventListener('change', (e) => {
                const checked = e.target.checked;
                document.querySelectorAll('.category-select-checkbox').forEach(cb => {
                    cb.checked = checked;
                });
                updateDeleteSelectedCategoriesVisibility();
            });
        }

        // Delete Selected Handler
        const deleteSelectedCategoriesBtn = document.getElementById('deleteSelectedCategoriesBtn');
        if (deleteSelectedCategoriesBtn) {
            deleteSelectedCategoriesBtn.addEventListener('click', async () => {
                const checkedCheckboxes = document.querySelectorAll('.category-select-checkbox:checked');
                const ids = Array.from(checkedCheckboxes).map(cb => parseInt(cb.getAttribute('data-category-id')));
                if (ids.length === 0) return;

                const confirmed = await showConfirmModal("ยืนยันการลบหลายประเภทสินค้า", `คุณต้องการลบประเภทสินค้าที่เลือกจำนวน ${ids.length} รายการ ใช่หรือไม่?`);
                if (!confirmed) return;

                try {
                    Swal.fire({
                        title: 'กำลังลบประเภทสินค้า...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    const response = await fetch('/api/categories/delete-bulk', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids })
                    });
                    
                    Swal.close();
                    const result = await response.json();
                    if (response.ok) {
                        showToast(result.message || "ลบประเภทสินค้าที่เลือกเรียบร้อยแล้ว", "success");
                        fetchCategories();
                    } else {
                        if (response.status === 401 || response.status === 403) {
                            localStorage.removeItem('user');
                            window.location.href = 'login.html';
                            return;
                        }
                        showToast(result.message || "ลบไม่สำเร็จ", "error");
                    }
                } catch (error) {
                    Swal.close();
                    showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
                }
            });
        }

        checkAuth();
        fetchCategories();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการแต้มสะสม - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
    <script type="module" src="/src/js/main.js"></script>
    <style>
        .premium-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            padding: 24px;
            transition: all 0.2s ease-in-out;
            max-width: 520px;
        }
        .premium-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .card-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .premium-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--secondary-berry);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .premium-btn:hover {
            background-color: var(--secondary-berry-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <header class="mobile-header"></header>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1 data-i18n="title.rewards">ระบบจัดการแต้มสะสม</h1>
                        <p style="color: #64748b; margin-top: 6px;">กำหนดอัตราการแจกแต้มสะสมจากยอดซื้อสินค้า</p>
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <div class="premium-card" style="width: 100%; max-width: 100%;">
                        <div class="card-header">
                            <h2><i class="fas fa-coins" style="color: #eab308;"></i> อัตราแต้มสะสม</h2>
                        </div>
                        <div id="settingsForm">
                            <div class="form-group" style="margin-bottom: 16px;">
                                <label for="pointEarningBaht" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #475569;">ยอดซื้อสินค้าครบทุกๆ (บาท) <span style="color: red;">*</span></label>
                                <input type="number" id="pointEarningBaht" class="form-control" min="1" step="1" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 24px;">
                                <label for="pointEarningQty" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #475569;">จะได้แต้มสะสมจำนวน (แต้ม) <span style="color: red;">*</span></label>
                                <input type="number" id="pointEarningQty" class="form-control" min="1" step="1" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;">
                            </div>
                            <button onclick="saveRewardSettings()" class="premium-btn" style="width: 100%; justify-content: center; padding: 12px;">
                                <i class="fas fa-save"></i> บันทึกอัตราแต้มสะสม
                            </button>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <div class="premium-card" style="width: 100%; max-width: 100%;">
                        <div class="card-header">
                            <h2><i class="fab fa-line" style="color: #06c755;"></i> ตั้งค่า LINE Official Account (Messaging API)</h2>
                        </div>
                        <div>
                            <p style="font-size: 13px; color: #64748b; margin-bottom: 16px;">กรอกข้อมูลเพื่อเชื่อมต่อระบบแจ้งเตือนเข้าแชทส่วนตัวหรือกลุ่ม LINE ด้วยไลน์ร้านตัวหลักของคุณ</p>
                            <div class="form-group" style="margin-bottom: 16px;">
                                <label for="lineOaToken" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #475569;">LINE Channel Access Token</label>
                                <input type="text" id="lineOaToken" class="form-control" placeholder="ใส่รหัส Channel Access Token สีแดงยาวๆ จาก LINE Developers" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 20px;">
                                <label for="lineTargetId" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #475569;">LINE Target User ID / Group ID</label>
                                <input type="text" id="lineTargetId" class="form-control" placeholder="ใส่รหัส User ID (ขึ้นต้นด้วยตัว U) หรือ Group ID ที่ต้องการรับข้อความ" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;">
                            </div>
                            <button onclick="saveRewardSettings()" class="premium-btn" style="width: 100%; justify-content: center; padding: 12px; background: linear-gradient(135deg, #06c755, #05b04b); border-color: #06c755;">
                                <i class="fas fa-save"></i> บันทึกการตั้งค่า LINE
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav"></nav>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        checkAuth();
        fetchSettings();

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role_name.toLowerCase() !== 'admin') {
                window.location.href = 'login.html';
            }
        }

        async function fetchSettings() {
            try {
                const response = await fetch('/api/rewards/settings');
                const result = await response.json();
                if (response.ok) {
                    document.getElementById('pointEarningBaht').value = parseFloat(result.data.point_earning_baht || 100);
                    document.getElementById('pointEarningQty').value = parseInt(result.data.point_earning_qty || 1);
                    document.getElementById('lineOaToken').value = result.data.line_oa_token || '';
                    document.getElementById('lineTargetId').value = result.data.line_target_id || '';
                } else {
                    showToast(result.message || "เกิดข้อผิดพลาดในการโหลดตั้งค่าแต้ม", "error");
                }
            } catch (error) {
                console.error("fetchSettings error:", error);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อเพื่อดึงการตั้งค่า", "error");
            }
        }

        async function saveRewardSettings() {
            const bahtInput = document.getElementById('pointEarningBaht');
            const qtyInput = document.getElementById('pointEarningQty');
            const tokenInput = document.getElementById('lineOaToken');
            const targetInput = document.getElementById('lineTargetId');
            const baht = parseFloat(bahtInput.value);
            const qty = parseInt(qtyInput.value);
            const lineToken = tokenInput.value.trim();
            const lineTarget = targetInput.value.trim();

            if (isNaN(baht) || baht <= 0) {
                showToast("กรุณาระบุจำนวนยอดซื้อขั้นต่ำในอัตราแต้มที่ถูกต้อง (> 0)", "error");
                bahtInput.focus();
                return;
            }
            if (isNaN(qty) || qty <= 0) {
                showToast("กรุณาระบุแต้มที่ได้รับที่ถูกต้อง (> 0)", "error");
                qtyInput.focus();
                return;
            }

            const payload = {
                point_earning_baht: baht,
                point_earning_qty: qty,
                point_redemption_rate: 1.00, // Default 1 Pts = 1 Baht
                line_oa_token: lineToken,
                line_target_id: lineTarget
            };

            try {
                const response = await fetch('/api/rewards/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (response.ok) {
                    showToast("บันทึกการตั้งค่าสำเร็จแล้ว", "success");
                } else {
                    showToast(result.message || "เกิดข้อผิดพลาดในการบันทึกการตั้งค่า", "error");
                }
            } catch (error) {
                console.error("saveRewardSettings error:", error);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการโปรโมชั่น - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Mobile User-Agent Check -->
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
<script type="module" src="/src/js/main.js"></script>
    <style>
        .premium-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            padding: 24px;
            transition: all 0.2s ease-in-out;
        }
        .premium-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .card-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rate-table {
            width: 100%;
            border-collapse: collapse;
        }
        .rate-table th {
            text-align: left;
            padding: 12px;
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 1px solid #e2e8f0;
        }
        .rate-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            color: #334155;
        }
        .rate-table tr:hover td {
            background-color: #f8fafc;
        }
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            color: #64748b;
            transition: all 0.15s;
        }
        .action-btn:hover {
            background-color: #f1f5f9;
        }
        .action-btn.edit:hover {
            color: var(--secondary-berry);
            background-color: var(--secondary-berry-light);
        }
        .action-btn.delete:hover {
            color: #ef4444;
            background-color: #fee2e2;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #94a3b8;
            text-align: center;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: #cbd5e1;
        }
        .empty-state p {
            margin: 0;
            font-size: 14px;
        }
        .premium-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--secondary-berry);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .premium-btn:hover {
            background-color: var(--secondary-berry-hover);
            transform: translateY(-1px);
        }
        .premium-btn.secondary {
            background-color: var(--secondary-berry-light); color: var(--secondary-berry-hover); border: 1px solid var(--secondary-berry-border);
        }
        .premium-btn.secondary:hover {
            background-color: var(--secondary-berry-border);
        }
        .premium-btn.danger {
            background-color: #ef4444;
        }
        .premium-btn.danger:hover {
            background-color: #dc2626;
        }
        .badge {
            background-color: #fef3c7;
            color: #d97706;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #fde68a;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .modal-body {
            padding: 16px 0;
        }

        /* Promotions Mobile Responsive: View-Only on Mobile */
        @media (max-width: 768px) {
            .premium-card { padding: 14px 12px !important; border-radius: 16px !important; margin-top: 12px !important; }
            .card-header { margin-bottom: 12px !important; }
            .card-header h2 { font-size: 15px !important; }
            .page-header {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 6px !important;
            }
            .page-header p { font-size: 12px !important; }
            
            /* View-Only on Mobile: Hide Add button and Edit/Delete Action column */
            #addPromoBtn, #mobileAddBtn, .fab-add, .empty-add-btn,
            .rate-table th:last-child,
            .rate-table td:last-child,
            .action-btns {
                display: none !important;
            }
            
            .table-responsive {
                overflow-x: hidden !important;
                width: 100% !important;
            }
            .rate-table {
                table-layout: fixed !important;
                width: 100% !important;
                min-width: 0 !important;
            }
            .rate-table th, .rate-table td {
                padding: 10px 4px !important;
                font-size: 12px !important;
                vertical-align: middle !important;
                box-sizing: border-box !important;
            }
            .rate-table th:first-child, .rate-table td:first-child {
                width: 32% !important;
                white-space: nowrap !important;
            }
            .rate-table th:nth-child(2), .rate-table td:nth-child(2) {
                width: 50% !important;
                word-break: break-word !important;
            }
            .rate-table th:nth-child(3), .rate-table td:nth-child(3) {
                width: 18% !important;
                text-align: center !important;
                white-space: nowrap !important;
            }
            .badge {
                font-size: 11px !important;
                padding: 3px 6px !important;
                white-space: normal !important;
                word-break: break-word !important;
                display: inline-flex !important;
                align-items: center !important;
                gap: 4px !important;
                line-height: 1.3 !important;
                max-width: 100% !important;
            }
        }

        html.mobile-device #addPromoBtn,
        html.mobile-device #mobileAddBtn,
        html.mobile-device .fab-add,
        html.mobile-device .empty-add-btn,
        html.mobile-device .rate-table th:last-child,
        html.mobile-device .rate-table td:last-child,
        html.mobile-device .action-btns {
            display: none !important;
        }
    </style>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <header class="mobile-header"></header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div style="max-width: 1000px; margin: 0 auto;">
                <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>โปรโมชั่น</h1>
                        <p style="color: #64748b; margin-top: 6px;">จัดการโปรโมชั่นของแถมตามระดับยอดซื้อสินค้า</p>
                    </div>
                </div>

                <div class="premium-card" style="margin-top: 20px;">
                    <div class="card-header">
                        <h2><i class="fas fa-gift" style="color: #ef4444;"></i> รายการของแถมตามระดับยอดซื้อ</h2>
                        <button onclick="openGiftModal()" class="premium-btn" id="addPromoBtn" style="padding: 8px 16px; font-size: 14px;">
                            <i class="fas fa-plus"></i> เพิ่มโปรโมชั่น
                        </button>
                    </div>
                    <div id="giftsContainer">
                        <div class="loading-container">
                            <div class="spinner-loader"></div>
                            <span>กำลังโหลดข้อมูล...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Floating Add Button for Mobile -->
        <button class="fab-add" id="mobileAddBtn" onclick="openGiftModal()" style="border: none;">
            <i class="fas fa-plus"></i>
        </button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="admin_dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span data-i18n="nav.dashboard">แดชบอร์ด</span>
            </a>
            <a href="admin_orders.html" class="nav-item">
                <i class="fas fa-file-invoice"></i>
                <span data-i18n="nav.orders">คำสั่งซื้อ</span>
            </a>
            <a href="admin_stock.html" class="nav-item">
                <i class="fas fa-box"></i>
                <span data-i18n="nav.stock">จัดการคลังสินค้า</span>
            </a>
            <a href="admin_customers.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span data-i18n="nav.customers">ลูกค้า</span>
            </a>
            <a href="admin_promotions.html" class="nav-item active">
                <i class="fas fa-bullhorn"></i>
                <span data-i18n="nav.promotions">โปรโมชั่น</span>
            </a>
        </nav>
    </div>

    <!-- Add/Edit Gift Modal -->
    <div id="giftModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="giftModalTitle">เพิ่มระดับของแถมใหม่</div>
            <div class="modal-body">
                <input type="hidden" id="modalGiftId">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="minSpend" style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px;">ยอดซื้อสินค้าสุทธิขั้นต่ำ (บาท) <span style="color: red;">*</span></label>
                    <input type="number" id="minSpend" class="form-control" min="0" step="10" placeholder="เช่น 300, 500, 1000" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="giftName" style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px;">ชื่อของแถม <span style="color: red;">*</span></label>
                    <input type="text" id="giftName" class="form-control" placeholder="เช่น ลูกบอลแมวเด้งดึ้ง, เบาะนอนสัตว์เลี้ยง" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label for="giftQty" style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px;">จำนวนของแถม (ชิ้น)</label>
                    <input type="number" id="giftQty" class="form-control" min="1" step="1" value="1" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
            </div>
            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" onclick="closeGiftModal()">ยกเลิก</button>
                <button class="premium-btn" onclick="saveGiftRule()">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="deleteModalTitle">ยืนยันการลบ</div>
            <div class="modal-text" id="deleteModalText">คุณแน่ใจหรือไม่ว่าต้องการลบโปรโมชั่นรายการนี้?</div>
            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" onclick="closeDeleteModal()">ยกเลิก</button>
                <button class="premium-btn danger" id="confirmDeleteBtn">ยืนยันการลบ</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let allGiftRules = [];
        let deleteTargetId = null;

        checkAuth();
        fetchGiftRules();

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role_name.toLowerCase() !== 'admin') {
                window.location.href = 'login.html';
            }
        }

        async function fetchGiftRules() {
            const container = document.getElementById('giftsContainer');
            try {
                const response = await fetch('/api/rewards/gifts');
                const result = await response.json();
                if (response.ok) {
                    allGiftRules = result.data || [];
                    renderGiftRules();
                } else {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    container.innerHTML = `<div style="padding: 30px; text-align: center; color: #ef4444;">${result.message || "เกิดข้อผิดพลาดในการโหลดข้อมูล"}</div>`;
                }
            } catch (error) {
                console.error("fetchGiftRules error:", error);
                container.innerHTML = `<div style="padding: 30px; text-align: center; color: #ef4444;">เกิดข้อผิดพลาดในการเชื่อมต่อ</div>`;
            }
        }

        function renderGiftRules() {
            const container = document.getElementById('giftsContainer');
            if (allGiftRules.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-gift" style="font-size: 36px; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <p style="margin: 0; font-size: 14px; margin-bottom: 12px;">ยังไม่มีโปรโมชั่นของแถมในระบบ</p>
                        <button onclick="openGiftModal()" class="premium-btn secondary empty-add-btn" style="padding: 6px 12px; font-size: 13px;">
                            <i class="fas fa-plus"></i> เพิ่มโปรโมชั่นแรก
                        </button>
                    </div>`;
                return;
            }

            let html = `
                <div class="table-responsive">
                <table class="rate-table">
                    <thead>
                        <tr>
                            <th>ยอดซื้อขั้นต่ำ (บาท)</th>
                            <th>ของแถมที่ได้รับ</th>
                            <th style="text-align: center;">จำนวน (ชิ้น)</th>
                            <th style="text-align: right;">การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody>`;

            allGiftRules.forEach(rule => {
                html += `
                    <tr>
                        <td><strong>฿${parseFloat(rule.min_spend).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</strong></td>
                        <td><span class="badge"><i class="fas fa-gift"></i> ${rule.gift_name}</span></td>
                        <td style="text-align: center;"><strong>${rule.gift_qty}</strong></td>
                        <td style="text-align: right;">
                            <div class="action-btns" style="justify-content: flex-end;">
                                <button class="action-btn edit" onclick="openGiftModal(${rule.rule_id})" title="แก้ไขโปรโมชั่น"><i class="fas fa-edit"></i></button>
                                <button class="action-btn delete" onclick="confirmDelete(${rule.rule_id})" title="ลบโปรโมชั่น"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function openGiftModal(ruleId = null) {
            const modal = document.getElementById('giftModal');
            const title = document.getElementById('giftModalTitle');
            const idInput = document.getElementById('modalGiftId');
            const minSpendInput = document.getElementById('minSpend');
            const giftNameInput = document.getElementById('giftName');
            const giftQtyInput = document.getElementById('giftQty');

            if (ruleId) {
                title.innerText = 'แก้ไขระดับของแถม';
                const rule = allGiftRules.find(r => r.rule_id == ruleId);
                idInput.value = rule.rule_id;
                minSpendInput.value = Math.floor(parseFloat(rule.min_spend));
                giftNameInput.value = rule.gift_name;
                giftQtyInput.value = rule.gift_qty;
            } else {
                title.innerText = 'เพิ่มระดับของแถมใหม่';
                idInput.value = '';
                minSpendInput.value = '';
                giftNameInput.value = '';
                giftQtyInput.value = '1';
            }
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeGiftModal() {
            const modal = document.getElementById('giftModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        async function saveGiftRule() {
            const id = document.getElementById('modalGiftId').value;
            const minSpendInput = document.getElementById('minSpend');
            const giftNameInput = document.getElementById('giftName');
            const giftQtyInput = document.getElementById('giftQty');

            const min_spend = parseFloat(minSpendInput.value);
            const gift_name = giftNameInput.value.trim();
            const gift_qty = parseInt(giftQtyInput.value) || 1;

            if (isNaN(min_spend) || min_spend < 0) {
                showToast("กรุณากรอกยอดซื้อสุทธิขั้นต่ำที่ถูกต้อง (ต้องไม่น้อยกว่า 0)", "error");
                minSpendInput.focus();
                return;
            }
            if (!gift_name) {
                showToast("กรุณากรอกชื่อของแถม", "error");
                giftNameInput.focus();
                return;
            }

            const payload = {
                min_spend: min_spend,
                gift_name: gift_name,
                gift_qty: gift_qty
            };

            if (id) {
                payload.rule_id = id;
            }

            try {
                const response = await fetch('/api/rewards/gifts/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (response.ok) {
                    showToast(id ? "อัปเดตโปรโมชั่นสำเร็จ" : "เพิ่มโปรโมชั่นสำเร็จ", "success");
                    closeGiftModal();
                    fetchGiftRules();
                } else {
                    showToast(result.message || "เกิดข้อผิดพลาดในการบันทึกข้อมูล", "error");
                }
            } catch (error) {
                console.error("saveGiftRule error:", error);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

        function confirmDelete(ruleId) {
            deleteTargetId = ruleId;
            const modal = document.getElementById('deleteModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!deleteTargetId) return;

            try {
                const response = await fetch('/api/rewards/gifts/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rule_id: deleteTargetId })
                });
                const result = await response.json();
                if (response.ok) {
                    showToast("ลบโปรโมชั่นเรียบร้อยแล้ว", "success");
                    closeDeleteModal();
                    fetchGiftRules();
                } else {
                    showToast(result.message || "เกิดข้อผิดพลาดในการลบ", "error");
                }
            } catch (error) {
                console.error("deleteGiftRule error:", error);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        });

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        const lBtn = document.getElementById('logoutBtn'); if (lBtn) lBtn.addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('user'); window.location.href = 'login.html'; });

        function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.getElementById('sidebarOverlay'); if (sidebar && overlay) { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); } }

        const hBtn = document.getElementById('hamburgerBtn'); if (hBtn) hBtn.addEventListener('click', toggleSidebar);
        const sOverlay = document.getElementById('sidebarOverlay'); if (sOverlay) sOverlay.addEventListener('click', toggleSidebar);

        function toggleSubmenu(el) {
            const group = el.closest('.menu-group');
            if (group) {
                group.classList.toggle('open');
                localStorage.setItem('productsMenuOpen', group.classList.contains('open'));
            }
        }
    </script>
</body>
</html>

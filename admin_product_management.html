<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสินค้า - Hello Pet Shop</title>
    <link rel="stylesheet" href="/css/admin_styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- Mobile User-Agent Check -->
    <script>
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-device');
        }
    </script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #barcodePrintArea, #barcodePrintArea * {
                visibility: visible;
            }
            #barcodePrintArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: flex !important;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: white;
            }
            .barcode-label {
                width: 50mm;
                height: 30mm;
                padding: 1.5mm;
                border: 1px solid #000;
                margin: 0;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                box-sizing: border-box;
                page-break-inside: avoid;
            }
            .barcode-label-title {
                font-family: 'Outfit', 'Kanit', sans-serif;
                font-size: 8px;
                font-weight: bold;
                margin-bottom: 1px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                width: 100%;
                color: #000;
            }
            .barcode-label-price {
                font-family: 'Outfit', 'Kanit', sans-serif;
                font-size: 9px;
                font-weight: bold;
                margin-top: 1px;
                color: #000;
            }
            .barcode-label svg {
                max-width: 100%;
                height: 12mm;
            }
        }
        #historyBtn:hover {
            background-color: #cbd5e1 !important;
        }
    </style>
    <script type="module" src="/src/js/main.js"></script>
</head>
<body class="preload">
    <div class="admin-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-header"></header>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h1 data-i18n="title.product_mgmt">จัดการสินค้า</h1>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button type="button" id="historyBtn" style="padding: 10px 20px; font-size: 14px; background-color: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 12px; font-weight: 600; color: #475569; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; outline: none; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); height: 42px; white-space: nowrap; width: auto;">
                        <i class="fas fa-history" style="color: #475569;"></i>
                        <span>ประวัติการเพิ่มสินค้า</span>
                    </button>
                    <a href="admin_product_edit.html" class="save-btn" style="padding: 10px 24px; font-size: 14px; display: inline-flex; align-items: center; height: 42px; text-decoration: none;">
                        <i class="fas fa-plus" style="margin-right: 8px;"></i>
                        <span data-i18n="btn.add_product">เพิ่มสินค้าใหม่</span>
                    </a>
                </div>
            </div>

            <!-- Search -->
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ค้นหา..." data-i18n-placeholder="label.search_placeholder">
            </div>

            <!-- Table -->
            <div class="stock-table">
                <div class="table-header">
                    <span style="flex: 2;" data-i18n="label.product_name">ชื่อสินค้า</span>
                    <span style="flex: 1; text-align: center;" data-i18n="label.price">ราคา</span>
                    <span style="flex: 1; text-align: center;" data-i18n="label.stock_qty">จำนวนในสต็อก</span>
                    <span style="flex: 1.5; text-align: right;" data-i18n="label.action">การดำเนินการ</span>
                </div>
                <div id="productContainer">
                    <div style="padding: 50px; text-align: center; color: #718096;">กำลังโหลดข้อมูล...</div>
                </div>
            </div>
        </main>

        <!-- Floating Add Button for Mobile -->
        <a href="admin_product_edit.html" class="fab-add">
            <i class="fas fa-plus"></i>
        </a>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav"></nav>
    </div>

    <!-- Barcode Management Modal -->
    <div id="barcodeModal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 450px;">
            <div class="modal-title" style="margin-bottom: 12px;">จัดการบาร์โค้ดสินค้า</div>
            <div style="font-size: 14px; color: #4a5568; margin-bottom: 20px; font-weight: 600;" id="barcodeModalProductName">ชื่อสินค้า</div>
            
            <div style="text-align: center; background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px dashed #cbd5e1;">
                <svg id="barcodeSvg"></svg>
                <div id="barcodeValueLabel" style="font-size: 14px; font-family: monospace; color: #475569; margin-top: 8px;">HP-XXX</div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; text-align: left;">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">แก้ไข/กำหนดรหัสบาร์โค้ด</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="barcodeInput" style="flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.15s ease;" placeholder="เว้นว่างไว้เพื่อสร้างอัตโนมัติ">
                    <button class="save-btn" id="generateRandomBarcodeBtn" style="padding: 8px 16px; font-size: 13px; background: #475569; white-space: nowrap;">สร้างสุ่ม</button>
                </div>
            </div>

            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" onclick="closeBarcodeModal()">ปิด</button>
                <button class="modal-btn modal-btn-confirm" id="saveBarcodeBtn" style="background: #4f46e5;">บันทึกรหัส</button>
                <button class="modal-btn modal-btn-confirm" id="printBarcodeBtn" style="background: #059669;">พิมพ์ป้าย</button>
            </div>
        </div>
    </div>

    <!-- Hidden Barcode Printable Frame -->
    <div id="barcodePrintArea" style="display: none;"></div>

    <div id="toast" class="toast"></div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title" id="modalTitle">ยืนยันการลบ</div>
            <div class="modal-text" id="modalText">คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้?</div>
            <div class="modal-btns">
                <button class="modal-btn modal-btn-cancel" id="cancelModalBtn">ยกเลิก</button>
                <button class="modal-btn modal-btn-confirm" id="confirmModalBtn">ลบสินค้า</button>
            </div>
        </div>
    </div>

    <!-- Product Creation History Modal -->
    <div id="historyModal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 700px; width: 90%;">
            <div class="modal-title" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                <span>ประวัติการเพิ่มสินค้า (Product Add History)</span>
                <button id="closeHistoryBtn" style="border: none; background: transparent; font-size: 24px; cursor: pointer; color: #94a3b8; outline: none;">&times;</button>
            </div>
            
            <div style="overflow-y: auto; max-height: 50vh; margin-top: 15px; border: 1px solid #e2e8f0; border-radius: 8px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                    <thead>
                        <tr style="background-color: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                            <th style="padding: 12px; font-weight: 600; color: #475569;">วันที่เพิ่ม</th>
                            <th style="padding: 12px; font-weight: 600; color: #475569;">ชื่อสินค้า</th>
                            <th style="padding: 12px; font-weight: 600; color: #475569;">หมวดหมู่</th>
                            <th style="padding: 12px; font-weight: 600; color: #475569;">ผู้เพิ่มสินค้า</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="4" style="padding: 30px; text-align: center; color: #94a3b8;">กำลังโหลดประวัติ...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="modal-btns" style="margin-top: 20px; justify-content: flex-end;">
                <button class="modal-btn modal-btn-cancel" id="closeHistoryBtn2" style="padding: 10px 24px;">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        let currentKeyword = '';

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.role_name.toLowerCase() !== 'admin') {
                window.location.href = 'login.html';
            }
        }

        let currentProductsList = [];

        async function fetchProducts() {
            try {
                const url = `/api/products?keyword=${encodeURIComponent(currentKeyword)}`;
                const response = await fetch(url);
                const result = await response.json();
                if (response.ok) {
                    currentProductsList = result.data || [];
                    renderProducts(currentProductsList);
                } else {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    showToast(result.message || "เกิดข้อผิดพลาดในการดึงข้อมูล", "error");
                }
            } catch (error) {
                console.error("fetchProducts error:", error);
                showToast("เกิดข้อผิดพลาดในการดึงข้อมูล", "error");
            }
        }

        function openBarcodeModalById(id) {
            const p = currentProductsList.find(prod => (prod.product_id == id || prod.id == id));
            if (p) {
                const pId = p.product_id || p.id;
                const pName = p.product_name || p.name || 'สินค้า';
                const pBarcode = p.barcode || '';
                const pPrice = p.selling_price || p.price || 0;
                openBarcodeModal(pId, pName, pBarcode, pPrice);
            }
        }

        function deleteProductById(id) {
            const p = currentProductsList.find(prod => (prod.product_id == id || prod.id == id));
            if (p) {
                const pId = p.product_id || p.id;
                const pName = p.product_name || p.name || '';
                deleteProduct(pId, pName);
            }
        }

        window.openBarcodeModalById = openBarcodeModalById;
        window.deleteProductById = deleteProductById;
        window.fetchProducts = fetchProducts;

        function renderProducts(products) {
            const container = document.getElementById('productContainer');
            if (!products || products.length === 0) {
                container.innerHTML = '<div style="padding: 50px; text-align: center; color: #718096;">ไม่พบสินค้า</div>';
                return;
            }

            container.innerHTML = products.map(p => {
                const pId = p.product_id || p.id;
                return `
                <div class="product-row" style="display: flex; align-items: center; width: 100%;">
                    <div class="product-details" style="flex: 2; margin-right: 20px;">
                        <div class="product-name">${p.product_name || p.name || ''}</div>
                    </div>
                    <div class="stock-status" style="flex: 1; text-align: center; color: #475569; font-weight: 500;">
                        ฿${parseFloat(p.selling_price || p.price || 0).toFixed(2)}
                    </div>
                    <div class="stock-status" style="flex: 1; text-align: center; color: #475569; font-weight: 500;">
                        ${p.stock_qty || 0}
                    </div>
                    <div class="stock-actions" style="flex: 1.5; text-align: right; justify-content: flex-end; display: flex; gap: 8px; align-items: center;">
                        <button type="button" onclick="event.preventDefault(); window.openBarcodeModalById(${pId})" class="action-link barcode-link" title="Barcode" style="cursor:pointer; font-family:inherit;">
                            <i class="fas fa-barcode"></i>
                            <span data-i18n="btn.barcode">บาร์โค้ด</span>
                        </button>
                        <a href="admin_product_edit.html?id=${pId}" class="action-link edit-link" title="Edit Product">
                            <i class="fas fa-edit"></i>
                        </a>
                        <button type="button" onclick="event.preventDefault(); window.deleteProductById(${pId})" class="action-link delete-link" title="Delete Product" style="cursor:pointer; font-family:inherit;">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `;
            }).join('');
            if (window.applyTranslations) window.applyTranslations();
        }

        async function deleteProduct(id, name) {
            const confirmed = await showConfirmModal("ยืนยันการลบสินค้า", `คุณต้องการลบสินค้า "${name}" ใช่หรือไม่?`);
            if (!confirmed) return;
            
            try {
                const response = await fetch(`/api/products/delete?id=${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast("ลบสินค้าเรียบร้อย", "success");
                    fetchProducts();
                } else {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    const res = await response.json();
                    showToast(res.message || "ลบไม่สำเร็จ", "error");
                }
            } catch (error) {
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        }

        function showConfirmModal(title, text) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                const titleEl = document.getElementById('modalTitle');
                const textEl = document.getElementById('modalText');
                const confirmBtn = document.getElementById('confirmModalBtn');
                const cancelBtn = document.getElementById('cancelModalBtn');

                titleEl.textContent = title;
                textEl.textContent = text;
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);

                const handleConfirm = () => { cleanup(); resolve(true); };
                const handleCancel = () => { cleanup(); resolve(false); };

                const cleanup = () => {
                    modal.classList.remove('show');
                    setTimeout(() => modal.style.display = 'none', 300);
                    confirmBtn.removeEventListener('click', handleConfirm);
                    cancelBtn.removeEventListener('click', handleCancel);
                };

                confirmBtn.addEventListener('click', handleConfirm);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentKeyword = e.target.value;
            fetchProducts();
        });

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            });
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        function toggleSidebar() { const sidebar = document.querySelector('.sidebar'); const overlay = document.getElementById('sidebarOverlay'); if (sidebar && overlay) { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); } }

        const hamburgerBtn = document.getElementById('hamburgerBtn');
        if (hamburgerBtn) hamburgerBtn.addEventListener('click', toggleSidebar);
        
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);

        function toggleSubmenu(el) {
            const group = el.closest('.menu-group');
            if (group) {
                group.classList.toggle('open');
                localStorage.setItem('productsMenuOpen', group.classList.contains('open'));
            }
        }

        // Restore submenu state
        document.addEventListener('DOMContentLoaded', () => {
            const menuGroup = document.querySelector('.menu-group');
            if (menuGroup) {
                const isOpen = localStorage.getItem('productsMenuOpen');
                if (isOpen === 'true') menuGroup.classList.add('open');
                else if (isOpen === 'false') menuGroup.classList.remove('open');
            }
        });

        checkAuth();
        fetchProducts();

        let activeProductForBarcode = null;

        function openBarcodeModal(productId, productName, barcode, price) {
            activeProductForBarcode = { id: productId, name: productName, barcode: barcode, price: price };
            document.getElementById('barcodeModalProductName').textContent = productName;
            document.getElementById('barcodeInput').value = barcode;
            
            const modal = document.getElementById('barcodeModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            
            renderBarcodePreview(barcode || `HP-${productId}`);
        }

        function closeBarcodeModal() {
            const modal = document.getElementById('barcodeModal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => modal.style.display = 'none', 300);
            }
            activeProductForBarcode = null;
        }

        window.openBarcodeModal = openBarcodeModal;
        window.closeBarcodeModal = closeBarcodeModal;

        function renderBarcodePreview(value) {
            try {
                JsBarcode("#barcodeSvg", value, {
                    format: "CODE128",
                    width: 2,
                    height: 50,
                    displayValue: false
                });
                document.getElementById('barcodeValueLabel').textContent = value;
            } catch (e) {
                console.error("JsBarcode failed:", e);
            }
        }

        document.getElementById('barcodeInput').addEventListener('input', (e) => {
            let val = e.target.value.trim();
            if (!val && activeProductForBarcode) {
                val = `HP-${activeProductForBarcode.id}`;
            }
            renderBarcodePreview(val);
        });

        document.getElementById('generateRandomBarcodeBtn').addEventListener('click', () => {
            const rand = Math.floor(1000 + Math.random() * 9000);
            const val = `20000000${rand}`;
            document.getElementById('barcodeInput').value = val;
            renderBarcodePreview(val);
        });

        document.getElementById('saveBarcodeBtn').addEventListener('click', async () => {
            if (!activeProductForBarcode) return;
            const barcode = document.getElementById('barcodeInput').value.trim();
            
            try {
                const response = await fetch('/api/products/update-barcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: activeProductForBarcode.id, barcode: barcode })
                });

                if (response.ok) {
                    showToast("บันทึกรหัสบาร์โค้ดสำเร็จ", "success");
                    fetchProducts();
                    closeBarcodeModal();
                } else {
                    const res = await response.json();
                    showToast(res.message || "บันทึกไม่สำเร็จ", "error");
                }
            } catch (e) {
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
            }
        });

        document.getElementById('printBarcodeBtn').addEventListener('click', () => {
            if (!activeProductForBarcode) return;
            const barcode = document.getElementById('barcodeValueLabel').textContent;
            
            const printArea = document.getElementById('barcodePrintArea');
            printArea.innerHTML = `
                <div class="barcode-label">
                    <div class="barcode-label-title">Hello Pet Shop</div>
                    <div class="barcode-label-title" style="font-size: 7px;">${activeProductForBarcode.name}</div>
                    <svg id="barcodePrintSvg"></svg>
                    <div class="barcode-label-price">฿${parseFloat(activeProductForBarcode.price).toFixed(2)}</div>
                </div>
            `;
            
            JsBarcode("#barcodePrintSvg", barcode, {
                format: "CODE128",
                width: 1.8,
                height: 40,
                displayValue: true,
                fontSize: 10
            });
            
            window.print();
        });

        function openHistoryModal() {
            const modal = document.getElementById('historyModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            loadHistoryData();
        }

        function closeHistoryModal() {
            const modal = document.getElementById('historyModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function loadHistoryData() {
            const tbody = document.getElementById('historyTableBody');
            if (!currentProductsList || currentProductsList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding: 30px; text-align: center; color: #94a3b8;">ไม่พบข้อมูลสินค้า</td></tr>';
                return;
            }
            
            const sortedProducts = [...currentProductsList].sort((a, b) => {
                const idA = a.product_id || a.id || 0;
                const idB = b.product_id || b.id || 0;
                return idB - idA;
            });

            tbody.innerHTML = sortedProducts.map(p => {
                const dateObj = p.created_at ? new Date(p.created_at) : null;
                const formattedDate = dateObj 
                    ? dateObj.toLocaleDateString('th-TH', {
                        year: 'numeric', month: 'short', day: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                      })
                    : 'ไม่ระบุ';
                
                const creator = p.creator_name || 'Super Admin';
                const catName = p.category_name || '-';
                
                return `
                    <tr style="border-bottom: 1px solid #f1f5f9;">
                        <td style="padding: 12px; color: #475569;">${formattedDate}</td>
                        <td style="padding: 12px; font-weight: 600; color: #1e293b;">${p.product_name || p.name || ''}</td>
                        <td style="padding: 12px; color: #64748b;">${catName}</td>
                        <td style="padding: 12px; color: #475569; font-weight: 500;">
                            <span style="display: inline-flex; align-items: center; gap: 6px; background-color: #f1f5f9; padding: 4px 10px; border-radius: 12px; font-size: 12px;">
                                <i class="fas fa-user-edit" style="color: #94a3b8;"></i> ${creator}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.openHistoryModal = openHistoryModal;
        window.closeHistoryModal = closeHistoryModal;

        // Register DOM event listeners to avoid bundler scope resolution issues for inline onclick attributes
        document.addEventListener('DOMContentLoaded', () => {
            const hBtn = document.getElementById('historyBtn');
            const cBtn = document.getElementById('closeHistoryBtn');
            const cBtn2 = document.getElementById('closeHistoryBtn2');
            
            if (hBtn) hBtn.addEventListener('click', openHistoryModal);
            if (cBtn) cBtn.addEventListener('click', closeHistoryModal);
            if (cBtn2) cBtn2.addEventListener('click', closeHistoryModal);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</body>
</html>
